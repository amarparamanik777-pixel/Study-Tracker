<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Study Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14151A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#14151A; --surface:#1C1E26; --surface-2:#24262F; --surface-3:#2B2E3A;
    --border:#2E313D; --border-strong:#3A3D4B;
    --text:#EDEBE3; --text-2:#9294A3; --text-3:#63656F;
    --accent:#E8A33D; --accent-dim:#3A2F1E;
    --success:#7FA875; --success-dim:#20281E;
    --danger:#D9705B; --danger-dim:#2E1E1B;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Bitter',serif;}
  .app{max-width:440px; margin:0 auto; padding-bottom:84px; min-height:100vh; position:relative;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 20px 16px; border-bottom:1px solid var(--border);
  }
  .brand{font-family:'Bitter',serif; font-weight:700; font-size:15px; letter-spacing:2px; color:var(--text);}
  .brand span{color:var(--accent);}
  .date-stamp{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-3);
    border:1px solid var(--border-strong); border-radius:4px; padding:4px 8px;
    transform:rotate(-1.5deg);
  }
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .bell-btn{position:relative; background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-2);}
  .bell-btn svg{width:17px; height:17px;}
  .bell-badge{position:absolute; top:-5px; right:-5px; background:var(--danger); color:#fff; font-size:9.5px; font-weight:700; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; font-family:'Inter';}
  .session-panel-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:120; display:none;
  }
  .session-panel-backdrop.open{display:block;}
  .session-panel{
    position:absolute; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:440px;
    background:var(--bg); border-bottom:1px solid var(--border-strong); border-radius:0 0 16px 16px;
    max-height:88vh; overflow-y:auto; padding:18px 20px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  .session-panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .session-panel-head h2{font-family:'Bitter',serif; font-size:16px; font-weight:700; margin:0;}
  .panel-close-btn{background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text-2); border-radius:8px; width:30px; height:30px; font-size:16px; cursor:pointer; line-height:1;}

  .tab-panel{padding:20px;}
  .section-label{
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--text-3); margin:0 0 10px; font-weight:500;
  }
  .section-label.with-arrow{display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
  .section-label .arrow{transition:transform 0.15s;}
  .section-label .arrow.open{transform:rotate(180deg);}

  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .chip{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:20px; border:1px solid var(--border-strong);
    background:var(--surface); font-size:13px; color:var(--text-2);
    white-space:nowrap; cursor:pointer;
  }
  .chip .dot{width:8px; height:8px; border-radius:50%;}
  .chip.active{border-color:var(--dot-color, var(--accent)); color:var(--text); background:var(--surface-2);}
  .chip.add-chip{color:var(--accent); border-style:dashed;}

  .period-row{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:3px; margin-bottom:14px;}
  .period-btn{flex:1; border:none; background:transparent; color:var(--text-2); font-size:12.5px; padding:8px 0; border-radius:6px; cursor:pointer; font-family:'Inter';}
  .period-btn.active{background:var(--accent); color:#1A1409; font-weight:600;}
  .period-btn:disabled{opacity:0.4;}

  .mode-settings{display:flex; flex-direction:column; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:18px;}
  .setting-line{display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--text-2);}
  .setting-line input{
    width:60px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
    border-radius:6px; padding:6px 8px; font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:center;
  }

  .timer-wrap{display:flex; flex-direction:column; align-items:center; margin:8px 0 24px;}
  .dial{position:relative; width:220px; height:220px;}
  .dial svg{transform:rotate(-90deg);}
  .dial-time{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column;
  }
  .dial-time .t{font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:500; letter-spacing:1px;}
  .dial-time .lap{font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-top:4px;}
  .timer-controls{display:flex; gap:10px; margin-top:20px;}
  .btn{
    font-family:'Inter',sans-serif; font-size:14px; font-weight:600; border:none;
    border-radius:var(--radius); padding:12px 22px; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:#1A1409;}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border-strong);}
  .btn-danger{background:var(--danger-dim); color:var(--danger); border:1px solid var(--danger);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .hint{font-size:12px; color:var(--text-3); text-align:center; margin-top:14px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px;}
  .card-row{display:flex; align-items:center; justify-content:space-between;}

  .today-list{list-style:none; margin:0; padding:0;}
  .today-list li{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;
  }
  .today-list li:last-child{border-bottom:none;}
  .sess-left{display:flex; align-items:center; gap:8px; color:var(--text-2);}
  .sess-left .dot{width:8px; height:8px; border-radius:50%;}
  .sess-dur{font-family:'IBM Plex Mono',monospace; color:var(--text);}

  .insight-card{
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:10px; padding:14px 16px; margin-top:4px;
  }
  .insight-card.urgent{border-left-color:var(--danger);}
  .insight-label{display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin-bottom:6px;}
  .insight-card.urgent .insight-label{color:var(--danger);}
  .insight-text{font-size:13.5px; line-height:1.6; color:var(--text); white-space:pre-line;}

  .ask-shruti-btn{width:100%; margin-top:10px; font-size:13px; padding:10px 0;}
  .quick-q-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .quick-q{font-size:12px; padding:7px 12px; border-radius:16px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text-2); cursor:pointer;}
  .shruti-answer{margin-top:12px; font-size:13.5px; line-height:1.6; background:var(--surface-2); border-radius:8px; padding:12px 14px; display:none; white-space:pre-line;}
  .shruti-answer.show{display:block;}
  .routine-inline{display:none; gap:8px; margin-top:10px; align-items:center;}
  .routine-inline.open{display:flex;}
  .routine-inline input{width:70px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text); border-radius:6px; padding:7px 8px; font-family:'IBM Plex Mono',monospace; font-size:13px;}

  .stat-hero{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px;}
  .stat-hero .val{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:500;}
  .delta{font-size:12px; font-weight:600;}
  .delta.up{color:var(--success);}
  .delta.down{color:var(--danger);}

  .chart-box{
    position:relative; height:180px; margin:14px 0;
    background-image:linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size:100% 25%, 12.5% 100%; background-position:0 0;
  }
  .chart-hint{font-size:11px; color:var(--text-3); text-align:center; margin:-8px 0 10px;}

  .legend-row{display:flex; flex-wrap:wrap; gap:12px; font-size:11.5px; color:var(--text-2); margin-bottom:6px;}
  .legend-row span{display:flex; align-items:center; gap:5px;}
  .legend-row .dot{width:9px; height:9px; border-radius:2px;}

  .breakdown-list{list-style:none; margin:0 0 16px; padding:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .breakdown-list li{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; font-size:13px; border-bottom:1px solid var(--border);}
  .breakdown-list li:last-child{border-bottom:none;}
  .breakdown-list .bd-left{display:flex; align-items:center; gap:8px; color:var(--text-2);}
  .breakdown-list .dot{width:9px; height:9px; border-radius:50%;}
  .breakdown-head{font-size:11.5px; color:var(--text-3); padding:10px 14px 0;}

  .metric-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .metric{background:var(--surface-2); border-radius:8px; padding:12px 14px;}
  .metric .m-label{font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;}
  .metric .m-val{font-family:'IBM Plex Mono',monospace; font-size:18px;}

  .punch-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .punch-nav{background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text-2); border-radius:6px; padding:4px 10px; font-size:13px; cursor:pointer;}
  .punch-nav:disabled{opacity:0.3;}
  .punch-range{font-size:11px; color:var(--text-3); font-family:'IBM Plex Mono',monospace;}
  .punchcard{display:flex; gap:5px;}
  .punch{width:100%; aspect-ratio:1; border-radius:3px; background:var(--surface-3); border:1px solid var(--border-strong);}
  .punch.filled{background:var(--accent); border-color:var(--accent);}
  .punch.today{box-shadow:0 0 0 2px var(--accent-dim);}
  .streak-stats{display:flex; justify-content:space-between; margin-top:12px; font-size:12.5px; color:var(--text-2);}
  .streak-stats b{color:var(--text); font-family:'IBM Plex Mono',monospace; font-weight:500;}

  .goal-row{display:flex; align-items:center; gap:16px;}
  .ring-wrap{position:relative; width:64px; height:64px; flex:0 0 auto;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .goal-edit{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .goal-edit input{
    width:70px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
    border-radius:6px; padding:6px 8px; font-family:'IBM Plex Mono',monospace; font-size:13px;
  }

  .compare-sort{background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text); border-radius:6px; padding:6px 8px; font-size:12px; font-family:'Inter';}
  .compare-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .compare-row:last-child{border-bottom:none;}
  .compare-row.best{color:var(--accent);}
  .compare-row .cr-date{color:var(--text-2); font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .best-tag{font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; background:var(--accent-dim); color:var(--accent); padding:2px 6px; border-radius:8px; margin-left:6px;}

  .log-filter-row{display:flex; gap:8px; margin-bottom:16px;}
  .log-filter-row input[type=date]{
    flex:1; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
    border-radius:8px; padding:9px 10px; font-family:'Inter'; font-size:13px;
  }
  .log-date-group{margin-bottom:18px;}
  .log-date-head{font-size:12px; color:var(--text-3); letter-spacing:0.5px; margin-bottom:8px; font-family:'IBM Plex Mono',monospace;}
  .log-entry{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; margin-bottom:6px; position:relative; padding-left:16px;
  }
  .log-entry::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:3px 0 0 3px; background:var(--entry-color, var(--accent));}
  .log-entry-info{display:flex; flex-direction:column; gap:2px;}
  .log-entry-info .subj{font-size:13.5px; font-weight:500;}
  .log-entry-info .time{font-size:11.5px; color:var(--text-3); font-family:'IBM Plex Mono',monospace;}
  .log-entry-dur{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text-2);}
  .del-btn{background:none; border:none; color:var(--text-3); cursor:pointer; font-size:16px; padding:4px; line-height:1;}
  .del-btn:hover{color:var(--danger);}
  .empty-state{text-align:center; padding:40px 20px; color:var(--text-3); font-size:13px;}

  .subj-manager{margin-top:24px;}
  .subj-list{list-style:none; margin:0 0 12px; padding:0;}
  .subj-list li{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 0; font-size:13px; color:var(--text-2); border-bottom:1px solid var(--border);}
  .subj-list li .subj-left{display:flex; align-items:center; gap:8px;}
  .subj-list li .dot{width:9px; height:9px; border-radius:50%;}
  .add-subj-form{display:none; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-top:8px;}
  .add-subj-form.open{display:flex;}
  .add-subj-form input[type=text]{
    background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
    border-radius:6px; padding:9px 10px; font-family:'Inter'; font-size:13px;
  }
  .swatches{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch.sel{border-color:var(--text);}

  .type-row{display:flex; gap:6px;}
  .type-btn{flex:1; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-2); font-size:12px; padding:8px 0; border-radius:6px; cursor:pointer;}
  .type-btn.active{background:var(--accent); color:#1A1409; border-color:var(--accent); font-weight:600;}
  .plan-entry{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px;
    margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px;
    position:relative; padding-left:16px;
  }
  .plan-entry::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:3px 0 0 3px; background:var(--entry-color, var(--accent));}
  .plan-entry-info .title{font-size:13.5px; font-weight:500;}
  .plan-entry-info .meta{font-size:11.5px; color:var(--text-3); margin-top:2px;}
  .plan-badge{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; padding:2px 7px; border-radius:10px; background:var(--surface-2); color:var(--text-2);}
  .plan-badge.exam{background:var(--danger-dim); color:var(--danger);}
  .plan-badge.homework{background:var(--accent-dim); color:var(--accent);}
  .add-plan-form{display:none; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-top:10px;}
  .add-plan-form.open{display:flex;}
  .add-plan-form input[type=text], .add-plan-form input[type=date], .add-plan-form input[type=time], .add-plan-form input[type=number], .add-plan-form select{
    background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
    border-radius:6px; padding:9px 10px; font-family:'Inter'; font-size:13px; width:100%;
  }
  .field-row{display:flex; gap:8px;}
  .field-row > *{flex:1;}
  .field-label{font-size:11px; color:var(--text-3); margin-bottom:-4px;}
  .notif-row{display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--text-2);}

  .busy-entry{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px;
    margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;
  }
  .busy-entry .be-info .title{font-size:13px; font-weight:500;}
  .busy-entry .be-info .meta{font-size:11.5px; color:var(--text-3);}
  .day-toggle-row{display:flex; gap:4px; flex-wrap:wrap;}
  .day-toggle{width:36px; height:32px; border-radius:6px; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-2); font-size:11px; cursor:pointer;}
  .day-toggle.active{background:var(--accent); color:#1A1409; border-color:var(--accent); font-weight:600;}
  .suggest-card{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--success); border-radius:10px; padding:14px 16px;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:24px;
  }
  .modal-card{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:16px; padding:28px 24px;
    text-align:center; max-width:320px; width:100%;
  }
  .modal-flame{font-size:48px; line-height:1; margin-bottom:10px;}
  .modal-streak{font-family:'IBM Plex Mono',monospace; font-size:34px; font-weight:600; color:var(--accent); margin:4px 0;}
  .modal-sub{font-size:13px; color:var(--text-2); margin-bottom:20px; line-height:1.5;}

  .toast{
    position:fixed; left:50%; bottom:96px; transform:translate(-50%, 20px); opacity:0;
    max-width:380px; width:calc(100% - 40px); background:var(--surface-2); border:1px solid var(--accent);
    border-radius:12px; padding:12px 16px; font-size:13px; text-align:center; z-index:90;
    transition:all 0.25s ease; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}

  .tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:440px; display:flex; background:var(--surface);
    border-top:1px solid var(--border); padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .tab-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--text-3); font-family:'Inter'; font-size:10px;
    padding:6px 0; cursor:pointer; letter-spacing:0.2px;
  }
  .tab-item.active{color:var(--accent);}
  .tab-item svg{width:19px; height:19px;}

  .loading{display:flex; align-items:center; justify-content:center; height:60vh; color:var(--text-3); font-size:13px; font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="loading" id="loadingScreen">loading log&hellip;</div>
</div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEYS = { subjects:'subjects', sessions:'sessions', settings:'settings', events:'events', lastPopup:'lastPopup', activeTimer:'activeTimer', busyBlocks:'busyBlocks' };
const DEFAULT_SUBJECTS = [
  {id:'math', name:'Math', color:'#5B7FA6'},
  {id:'chem', name:'Chemistry', color:'#C97A56'},
  {id:'hist', name:'History', color:'#4C9A8E'},
  {id:'lang', name:'Language', color:'#8B6B9E'}
];
const SWATCH_COLORS = ['#5B7FA6','#C97A56','#4C9A8E','#8B6B9E','#C9A227','#B85C7A','#6B8E4E','#6E7A8A'];
const DEFAULT_SETTINGS = { dailyGoalMin: 120, timerMode:'stopwatch', focusMin: 25, breakMin: 5, notifyEnabled:false, soundEnabled:true, studyWindowStart:'16:00', studyWindowEnd:'23:00' };
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* ---------- storage ---------- */
function storageGet(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ console.error('read failed', key, e); return fallback; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ console.error('save failed', key, e); return false; }
}

/* ---------- sound ---------- */
let startSoundEl = null;
function playStartSound(){
  if(!state.settings.soundEnabled) return;
  try{
    if(!startSoundEl) startSoundEl = new Audio('sound-start.mp3');
    startSoundEl.currentTime = 0;
    startSoundEl.play().catch(function(){});
  }catch(e){}
}
let audioCtx = null;
function beep(freq, dur, vol){
  if(!state.settings.soundEnabled) return;
  freq = freq||660; dur = dur||150; vol = vol||0.16;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq; osc.type='sine';
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur/1000);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur/1000);
  }catch(e){}
}
function beepPattern(notes){
  let t = 0;
  notes.forEach(function(n){ setTimeout(function(){ beep(n[0], n[1]); }, t); t += n[2]||n[1]+40; });
}

/* ---------- timer state machine: crash-proof via persisted absolute checkpoints ---------- */
let timer = { mode:'stopwatch', phase:'idle', isBreak:false, elapsedSec:0, targetSec:0, lastTick:null };

function persistActiveTimer(){
  if(timer.phase==='idle'){ localStorage.removeItem(STORAGE_KEYS.activeTimer); return; }
  storageSet(STORAGE_KEYS.activeTimer, {
    subjectId: activeSubjectId, mode: timer.mode, isBreak: timer.isBreak,
    targetSec: timer.targetSec, elapsedSec: timer.elapsedSec, phase: timer.phase,
    savedAt: Date.now()
  });
}
function clearActiveTimer(){ localStorage.removeItem(STORAGE_KEYS.activeTimer); }

setInterval(function(){
  if(timer.phase !== 'running' || timer.lastTick == null) return;
  const now = Date.now();
  const delta = Math.floor((now - timer.lastTick)/1000);
  if(delta < 1) return;
  timer.lastTick += delta*1000;
  timer.elapsedSec += delta;
  persistActiveTimer();
  if(timer.mode !== 'stopwatch' && timer.elapsedSec >= timer.targetSec){
    timer.elapsedSec = timer.targetSec;
    updateTimerDisplay();
    handleTimerComplete();
    return;
  }
  updateTimerDisplay();
}, 1000);

function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ const x=new Date(d); return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); }
function fmtTime(d){ const x=new Date(d); let h=x.getHours(); const m=pad(x.getMinutes()); const ap=h>=12?'pm':'am'; h=h%12; if(h===0)h=12; return h+':'+m+ap; }
function todayStr(){ return fmtDate(new Date()); }
function daysAgoStr(n){ const d=new Date(); d.setDate(d.getDate()-n); return fmtDate(d); }
function daysFromNowStr(n){ const d=new Date(); d.setDate(d.getDate()+n); return fmtDate(d); }
function minutesToH(min){ return (min/60).toFixed(1)+'h'; }
function subjectById(id){ return state.subjects.find(function(s){ return s.id===id; }); }
function formatElapsed(totalSeconds){
  totalSeconds = Math.max(0, totalSeconds);
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  return h>0 ? (h+':'+pad(m)+':'+pad(s)) : (pad(m)+':'+pad(s));
}
function fmtTimeLabel(hhmm){
  const parts = hhmm.split(':'); let h = parseInt(parts[0],10); const m = parts[1];
  const ap = h>=12?'pm':'am'; h = h%12; if(h===0) h=12;
  return h+':'+m+ap;
}

function calcStreak(){
  const dateSet = new Set(state.sessions.map(function(s){ return fmtDate(s.start); }));
  let streak=0;
  let cursor = new Date();
  if(!dateSet.has(fmtDate(cursor))) cursor.setDate(cursor.getDate()-1);
  while(dateSet.has(fmtDate(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function showToast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(function(){ t.classList.remove('show'); }, ms||3500);
}

/* ---------- init with crash-recovery ---------- */
function init(){
  state.subjects = storageGet(STORAGE_KEYS.subjects, DEFAULT_SUBJECTS);
  if(!state.subjects.length) state.subjects = DEFAULT_SUBJECTS;
  state.sessions = storageGet(STORAGE_KEYS.sessions, []);
  state.settings = {...DEFAULT_SETTINGS, ...storageGet(STORAGE_KEYS.settings, {})};
  state.events = storageGet(STORAGE_KEYS.events, []);
  state.busyBlocks = storageGet(STORAGE_KEYS.busyBlocks, []);
  timer.mode = state.settings.timerMode || 'stopwatch';
  activeSubjectId = state.subjects[0] ? state.subjects[0].id : null;

  const active = storageGet(STORAGE_KEYS.activeTimer, null);
  if(active && subjectById(active.subjectId)){
    activeSubjectId = active.subjectId;
    timer.mode = active.mode; timer.isBreak = !!active.isBreak; timer.targetSec = active.targetSec||0;
    let elapsed = active.elapsedSec||0;
    if(active.phase === 'running'){
      elapsed += Math.max(0, Math.floor((Date.now() - active.savedAt)/1000));
    }
    if(timer.mode !== 'stopwatch' && elapsed >= timer.targetSec && timer.targetSec>0){
      timer.elapsedSec = timer.targetSec;
      timer.phase = 'running';
      timer.lastTick = Date.now();
      pendingCompletionOnLoad = true;
    } else {
      timer.elapsedSec = Math.max(0, elapsed);
      timer.phase = active.phase === 'paused' ? 'paused' : 'running';
      timer.lastTick = Date.now();
    }
  }

  buildShell();
  if(pendingCompletionOnLoad){
    pendingCompletionOnLoad = false;
    handleTimerComplete();
  } else {
    renderAll();
  }
  maybeShowStreakPopup();
  maybeNotifyUpcoming();
}

function updateTimerButtons(){
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const hint = document.getElementById('timerHint');
  if(!startBtn) return;

  if(timer.phase === 'idle'){
    startBtn.style.display=''; pauseBtn.style.display='none'; stopBtn.style.display='none';
    pauseBtn.textContent='Pause';
    startBtn.disabled = !activeSubjectId;
    hint.textContent = activeSubjectId ? ('Ready to log time for ' + (subjectById(activeSubjectId)||{}).name + '.') : 'Pick a subject, then start.';
  } else {
    startBtn.style.display='none'; pauseBtn.style.display=''; stopBtn.style.display='';
    pauseBtn.textContent = timer.phase==='running' ? 'Pause' : 'Resume';
    if(timer.phase==='running'){
      hint.textContent = timer.isBreak ? 'Break time.' : 'Session in progress.';
    } else if(timer.elapsedSec===0 && timer.mode==='pomodoro'){
      hint.textContent = timer.isBreak ? 'Break ready \u2014 tap Resume to start it.' : 'Next focus block ready \u2014 tap Resume.';
    } else {
      hint.textContent = 'Paused.';
    }
  }
}

function updateTimerDisplay(){
  const disp = document.getElementById('timerDisplay');
  const arc = document.getElementById('dialArc');
  if(!disp || !arc) return;
  const circumference = 616;
  let shown, frac;
  if(timer.mode === 'stopwatch'){
    shown = timer.elapsedSec;
    const lapSec = Math.max(60, state.settings.focusMin*60);
    frac = (timer.elapsedSec % lapSec) / lapSec;
  } else {
    const remaining = Math.max(0, timer.targetSec - timer.elapsedSec);
    shown = remaining;
    frac = timer.targetSec>0 ? (1 - remaining/timer.targetSec) : 0;
  }
  disp.textContent = formatElapsed(shown);
  arc.setAttribute('stroke-dashoffset', String(circumference*(1-frac)));
}

function startTimer(){
  if(!activeSubjectId || timer.phase !== 'idle') return;
  timer.elapsedSec = 0;
  timer.isBreak = false;
  timer.targetSec = timer.mode==='stopwatch' ? 0 : state.settings.focusMin*60;
  timer.phase = 'running';
  timer.lastTick = Date.now();
  persistActiveTimer();
  playStartSound();
  updateTimerButtons();
  updateTimerDisplay();
}
function pauseTimer(){
  if(timer.phase !== 'running') return;
  timer.phase = 'paused';
  persistActiveTimer();
  updateTimerButtons();
}
function resumeTimer(){
  if(timer.phase !== 'paused') return;
  timer.phase = 'running';
  timer.lastTick = Date.now();
  persistActiveTimer();
  updateTimerButtons();
}
function stopTimer(){
  const durationMin = Math.round(timer.elapsedSec/60);
  let logged = false;
  if(durationMin >= 1 && !timer.isBreak){
    const end = Date.now();
    const start = end - timer.elapsedSec*1000;
    state.sessions.push({ id:'s'+Date.now(), subjectId: activeSubjectId, start, end, durationMin });
    storageSet(STORAGE_KEYS.sessions, state.sessions);
    logged = true;
  }
  timer.phase='idle'; timer.elapsedSec=0; timer.targetSec=0; timer.lastTick=null; timer.isBreak=false;
  clearActiveTimer();
  beep(440,220);
  if(logged) checkLadderProgress();
  renderAll();
}
function handleTimerComplete(){
  const durationMin = Math.round(timer.elapsedSec/60);
  let logged = false;
  if(durationMin >= 1 && !timer.isBreak){
    const end = Date.now();
    const start = end - timer.elapsedSec*1000;
    state.sessions.push({ id:'s'+Date.now(), subjectId: activeSubjectId, start, end, durationMin });
    storageSet(STORAGE_KEYS.sessions, state.sessions);
    logged = true;
  }
  if(timer.mode === 'pomodoro'){
    timer.isBreak = !timer.isBreak;
    timer.elapsedSec = 0;
    timer.targetSec = timer.isBreak ? state.settings.breakMin*60 : state.settings.focusMin*60;
    timer.phase = 'paused';
    clearActiveTimer();
    if(timer.isBreak){ beepPattern([[880,120],[880,120]]); notifyLocal('Study Log', 'Focus block done \u2014 take a ' + state.settings.breakMin + ' min break.'); }
    else { beepPattern([[660,150]]); notifyLocal('Study Log', 'Break\u2019s over \u2014 tap Resume for the next focus block.'); }
  } else {
    timer.phase='idle'; timer.elapsedSec=0; timer.targetSec=0; timer.lastTick=null;
    clearActiveTimer();
    beepPattern([[660,140],[880,220]]);
    notifyLocal('Study Log', 'Timer complete.');
  }
  if(logged) checkLadderProgress();
  renderAll();
}

/* ---------- personal-record ladder ---------- */
function checkLadderProgress(){
  const todayS = todayStr();
  const todayTotal = state.sessions.filter(function(s){ return fmtDate(s.start)===todayS; }).reduce(function(a,s){ return a+s.durationMin; },0);
  const byDay = {};
  state.sessions.forEach(function(s){ const d=fmtDate(s.start); if(d!==todayS) byDay[d]=(byDay[d]||0)+s.durationMin; });
  const ladder = Object.values(byDay).sort(function(a,b){ return a-b; });
  if(ladder.length===0) return;
  const rungsBeaten = ladder.filter(function(v){ return todayTotal > v; }).length;
  const key = 'ladderRungsBeaten_'+todayS;
  const prevBeaten = parseInt(localStorage.getItem(key)||'0',10);
  if(rungsBeaten > prevBeaten){
    localStorage.setItem(key, String(rungsBeaten));
    const isBest = todayTotal > ladder[ladder.length-1];
    if(isBest){
      showToast('\uD83C\uDFC6 New personal best day \u2014 ' + minutesToH(todayTotal) + '!', 4500);
    }else{
      showToast('\uD83D\uDE80 You just beat your ' + ordinal(ladder.length - rungsBeaten + 1) + ' lowest study day!', 4000);
    }
  }
}
function ordinal(n){
  const s=['th','st','nd','rd']; const v=n%100;
  return n + (s[(v-20)%10]||s[v]||s[0]);
}

/* Shruti insight */
function renderInsight(){
  const card = document.getElementById('insightCard');
  const todayS = todayStr(), tomorrowS = daysFromNowStr(1);
  const urgent = state.events.filter(function(e){ return e.date===todayS || e.date===tomorrowS; })
    .sort(function(a,b){ return a.date<b.date?-1:1; });

  let text, isUrgent=false;
  if(urgent.length){
    const e = urgent[0];
    const subj = subjectById(e.subjectId);
    const when = e.date===todayS ? 'today' : 'tomorrow';
    const timeStr = e.time ? (' at ' + fmtTimeLabel(e.time)) : '';
    text = (subj?subj.name:'Your') + ' ' + e.type + ' \u201c' + e.title + '\u201d is ' + when + timeStr + '. ' + (e.type==='exam' ? 'Good time to review it.' : 'Make sure it\u2019s done in time.');
    isUrgent = true;
  } else {
    const todayMin = state.sessions.filter(function(s){ return fmtDate(s.start)===todayStr(); }).reduce(function(a,s){ return a+s.durationMin; },0);
    const last7 = [1,2,3,4,5,6,7].map(function(n){ return state.sessions.filter(function(s){ return fmtDate(s.start)===daysAgoStr(n); }).reduce(function(a,s){ return a+s.durationMin; },0); });
    const avg7 = last7.reduce(function(a,b){return a+b;},0)/7;
    const streak = calcStreak();
    const bySubject = {};
    state.sessions.forEach(function(s){ (bySubject[s.subjectId]=bySubject[s.subjectId]||[]).push(s.durationMin); });
    let longFlag=null;
    Object.entries(bySubject).forEach(function(entry){
      const durs=entry[1];
      if(durs.length>=3 && durs.reduce(function(a,b){return a+b;},0)/durs.length>45) longFlag=subjectById(entry[0]);
    });

    if(state.sessions.length===0){
      text = 'Log your first session and I\u2019ll start spotting patterns in your study habits.';
    }else if(longFlag){
      text = 'Your ' + longFlag.name + ' sessions average over 45 minutes. Try splitting them with a short break in between.';
    }else if(streak>=5){
      text = streak + '-day streak. That kind of consistency is what actually moves the needle.';
    }else if(avg7>0 && todayMin > avg7*1.3){
      text = 'You\u2019ve already beaten your 7-day average today \u2014 good day to tackle the subject you\u2019ve been avoiding.';
    }else if(streak===0){
      text = 'No session logged today yet. Even 15 minutes keeps the pattern going.';
    }else{
      text = 'Nothing urgent on your plate \u2014 a good day to get ahead on your weakest subject.';
    }
  }
  card.className = 'insight-card' + (isUrgent ? ' urgent' : '');
  card.innerHTML = '<div class="insight-label">' + (isUrgent ? 'Coming up' : 'Weekly pattern') + '</div><div class="insight-text">' + text + '</div>';
}

function sumForRange(startDate, endDate){
  return state.sessions.filter(function(s){ const d=fmtDate(s.start); return d>=startDate && d<=endDate; }).reduce(function(a,s){ return a+s.durationMin; },0);
}
function shrutiWeekAnswer(){
  const thisWeek = sumForRange(daysAgoStr(6), todayStr());
  const lastWeek = sumForRange(daysAgoStr(13), daysAgoStr(7));
  if(thisWeek===0) return 'Nothing logged this week yet \u2014 start a session whenever you\u2019re ready.';
  if(lastWeek===0) return 'You\u2019ve logged ' + minutesToH(thisWeek) + ' this week. No comparison yet for last week.';
  const pct = Math.round(((thisWeek-lastWeek)/lastWeek)*100);
  return 'You\u2019ve logged ' + minutesToH(thisWeek) + ' this week, ' + (pct>=0?'up ':'down ') + Math.abs(pct) + '% vs last week.';
}
function suggestedStudyMinutesToday(){
  const win = studyWindowMinutesToday();
  const busyToday = busyMinutesForDate(new Date());
  const free = Math.max(0, win - busyToday);
  return Math.min(480, Math.max(240, free>0?free:240));
}
function shrutiTodayAnswer(){
  const todayS = todayStr(), tomorrowS = daysFromNowStr(1);
  const urgent = state.events.filter(function(e){ return e.date===todayS || e.date===tomorrowS; });
  if(urgent.length){
    const subj = subjectById(urgent[0].subjectId);
    return 'Prioritize ' + (subj?subj.name:'that subject') + ' \u2014 you have a ' + urgent[0].type + ' due ' + (urgent[0].date===todayS?'today':'tomorrow') + '.';
  }
  const totals = {};
  state.subjects.forEach(function(s){ totals[s.id]=0; });
  state.sessions.filter(function(s){ return fmtDate(s.start)>=daysAgoStr(6); }).forEach(function(s){ if(totals[s.subjectId]!=null) totals[s.subjectId]+=s.durationMin; });
  let least=null;
  state.subjects.forEach(function(s){ if(least===null || totals[s.id]<totals[least.id]) least=s; });
  return least ? (least.name + ' has had the least attention this week \u2014 good one to pick up today.') : 'Add a subject first, then I can point you somewhere.';
}
function shrutiUpcomingAnswer(){
  const upcoming = state.events.filter(function(e){ return e.date>=todayStr(); }).sort(function(a,b){ return a.date<b.date?-1:1; }).slice(0,3);
  if(!upcoming.length) return 'Nothing logged yet \u2014 add an exam or homework entry in the Plan tab.';
  return upcoming.map(function(e){
    const subj = subjectById(e.subjectId);
    return (subj?subj.name:'') + ' ' + e.type + ': ' + e.title + ' (' + e.date + (e.time?' '+fmtTimeLabel(e.time):'') + ')';
  }).join('\n');
}
function shrutiStreakAnswer(){
  const streak = calcStreak();
  if(streak===0) return 'No active streak \u2014 log a session today to start one.';
  if(streak<3) return streak + '-day streak. Keep it going one more day.';
  if(streak<7) return streak + '-day streak \u2014 solid. Don\u2019t break it now.';
  return streak + '-day streak. That\u2019s genuinely impressive consistency.';
}
function shrutiBestDayAnswer(){
  const byDay = {};
  state.sessions.forEach(function(s){ const d=fmtDate(s.start); byDay[d]=(byDay[d]||0)+s.durationMin; });
  const entries = Object.entries(byDay);
  if(!entries.length) return 'No sessions logged yet \u2014 your first one will be the record to beat.';
  entries.sort(function(a,b){ return b[1]-a[1]; });
  return 'Your best day was ' + entries[0][0] + ' with ' + minutesToH(entries[0][1]) + ' logged.';
}
function shrutiNeglectAnswer(){
  const totals = {};
  state.subjects.forEach(function(s){ totals[s.id]=0; });
  state.sessions.filter(function(s){ return fmtDate(s.start)>=daysAgoStr(6); }).forEach(function(s){ if(totals[s.subjectId]!=null) totals[s.subjectId]+=s.durationMin; });
  const zero = state.subjects.filter(function(s){ return totals[s.id]===0; });
  if(zero.length) return zero.map(function(s){return s.name;}).join(', ') + ' — no time logged in the last 7 days.';
  let least=state.subjects[0];
  state.subjects.forEach(function(s){ if(totals[s.id]<totals[least.id]) least=s; });
  return least ? (least.name + ' has the least time this week (' + minutesToH(totals[least.id]) + ') \u2014 worth a look.') : 'Add a subject first.';
}
function shrutiConsistencyAnswer(){
  const dates = new Set(state.sessions.map(function(s){ return fmtDate(s.start); }));
  if(dates.size===0) return 'No sessions yet \u2014 nothing to measure consistency against.';
  const sorted = Array.from(dates).sort();
  const first = new Date(sorted[0]);
  const daysSince = Math.max(1, Math.round((new Date(todayStr())-first)/86400000)+1);
  const pct = Math.round((dates.size/daysSince)*100);
  return 'You\u2019ve studied on ' + dates.size + ' of the last ' + daysSince + ' days (' + pct + '%) since your first logged session.';
}
function shrutiBuildRoutine(availableMin){
  const todayS = todayStr(), tomorrowS = daysFromNowStr(1);
  let remaining = availableMin;
  const lines = [];
  const urgent = state.events.filter(function(e){ return e.date===todayS || e.date===tomorrowS; })
    .sort(function(a,b){ return (a.type==='exam'?0:1) - (b.type==='exam'?0:1); });
  urgent.forEach(function(e){
    if(remaining<=15) return;
    const subj = subjectById(e.subjectId);
    const block = Math.min(45, remaining, e.estMin||45);
    lines.push(block + ' min \u2014 ' + (subj?subj.name:'') + ': ' + e.title + ' (' + e.type + ')');
    remaining -= block;
    if(remaining>10){ lines.push('10 min \u2014 Break'); remaining -= 10; }
  });
  const totals = {};
  state.subjects.forEach(function(s){ totals[s.id]=0; });
  state.sessions.filter(function(s){ return fmtDate(s.start)>=daysAgoStr(6); }).forEach(function(s){ if(totals[s.subjectId]!=null) totals[s.subjectId]+=s.durationMin; });
  const ranked = state.subjects.slice().sort(function(a,b){ return totals[a.id]-totals[b.id]; });
  let i = 0;
  let guard = 0;
  while(remaining>15 && ranked.length && guard<20){
    guard++;
    const subj = ranked[i % ranked.length];
    const block = Math.min(40, remaining);
    lines.push(block + ' min \u2014 ' + subj.name);
    remaining -= block;
    if(remaining>10){ lines.push('10 min \u2014 Break'); remaining -= 10; }
    i++;
  }
  if(!lines.length) return 'Not enough time to build a routine \u2014 try a larger window.';
  return lines.join('\n');
}

function renderTrendsChart(){
  const ctx = document.getElementById('trendsCanvas');
  if(trendsChart){ trendsChart.destroy(); trendsChart=null; }

  let labels=[], datasets=[], totalMin=0, prevMin=0, title='';

    return state.subjects.map(function(subj){
      return { label: subj.name, data: dayStrs.map(function(d){ return state.sessions.filter(function(x){ return x.subjectId===subj.id && fmtDate(x.start)===d; }).reduce(function(a,x){ return a+x.durationMin; },0)/60; }), backgroundColor: subj.color, borderRadius:3 };
    });
  }

  if(activePeriod==='day'){
    title = 'Today';
    labels = state.subjects.map(function(s){ return s.name; });

    datasets = [{ label:'Today', data, backgroundColor: state.subjects.map(function(s){return s.color;}), borderRadius:4 }];
    totalMin = sumForRange(todayStr(), todayStr());
    prevMin = sumForRange(daysAgoStr(1), daysAgoStr(1));
    currentBuckets = state.subjects.map(function(){ return { start: todayStr(), end: todayStr() }; });
  } else if(activePeriod==='week'){
    title = 'This week';
    const dayStrs = [6,5,4,3,2,1,0].map(function(n){ return daysAgoStr(n); });
    labels = dayStrs.map(function(d){ return new Date(d).toLocaleDateString('en-US',{weekday:'short'}); });
    datasets = buildDatasetsForDays(dayStrs);
    totalMin = sumForRange(daysAgoStr(6), todayStr());
    prevMin = sumForRange(daysAgoStr(13), daysAgoStr(7));
    currentBuckets = dayStrs.map(function(d){ return { start:d, end:d }; });
  } else if(activePeriod==='month'){
    title = 'This month';
    labels = ['Week 1','Week 2','Week 3','Week 4'];
    const weekRanges = [[27,21],[20,14],[13,7],[6,0]];
    datasets = state.subjects.map(function(subj){
      return { label: subj.name, data: weekRanges.map(function(r){ return sumForSubjectRange(subj.id, daysAgoStr(r[0]), daysAgoStr(r[1]))/60; }), backgroundColor: subj.color, borderRadius:3 };
    });
    totalMin = sumForRange(daysAgoStr(27), todayStr());
    prevMin = sumForRange(daysAgoStr(55), daysAgoStr(28));
    currentBuckets = weekRanges.map(function(r){ return { start: daysAgoStr(r[0]), end: daysAgoStr(r[1]) }; });
  } else {
    title = 'This year';
    const now = new Date();
    const year = now.getFullYear();
    labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monthRanges = [];
    for(let mo=0; mo<12; mo++){
      const first = new Date(year, mo, 1); const last = new Date(year, mo+1, 0);
      monthRanges.push({ start: fmtDate(first), end: fmtDate(last) });
    }
    datasets = state.subjects.map(function(subj){
      return { label: subj.name, data: monthRanges.map(function(r){ return sumForSubjectRange(subj.id, r.start, r.end)/60; }), backgroundColor: subj.color, borderRadius:3 };
    });
    totalMin = sumForRange(fmtDate(new Date(year,0,1)), fmtDate(new Date(year,11,31)));
    prevMin = sumForRange(fmtDate(new Date(year-1,0,1)), fmtDate(new Date(year-1,11,31)));
    currentBuckets = monthRanges;
  }

  document.getElementById('trendTitle').textContent = title;
  document.getElementById('trendTotal').textContent = minutesToH(totalMin);
  const deltaEl = document.getElementById('trendDelta');
  if(prevMin>0){
    const pctChange = Math.round(((totalMin-prevMin)/prevMin)*100);
    deltaEl.textContent = (pctChange>=0?'+':'')+pctChange+'%';
    deltaEl.className = 'delta '+(pctChange>=0?'up':'down');
  }else{ deltaEl.textContent = ''; }

  trendsChart = new Chart(ctx, {
    type:'bar',

    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{

        const idx = elements[0].index;
        showBarBreakdown(idx);
      }
    }
  });

  const label = activePeriod==='day' ? state.subjects[idx].name : trendsChart.data.labels[idx];
  const totals = state.subjects.map(function(s){
    return { subj:s, min: sumForSubjectRange(s.id, bucket.start, bucket.end) };
  }).filter(function(t){ return t.min>0; }).sort(function(a,b){ return b.min-a.min; });
  const el = document.getElementById('barBreakdown');
  if(!totals.length){ el.innerHTML = '<div class="empty-state" style="padding:12px 0;">No sessions in this period.</div>'; return; }
  el.innerHTML = '<div class="breakdown-head">' + label + '</div><ul class="breakdown-list">' + totals.map(function(t){
    return '<li><span class="bd-left"><span class="dot" style="background:'+t.subj.color+'"></span>'+t.subj.name+'</span><span class="mono">'+minutesToH(t.min)+'</span></li>';
  }).join('') + '</ul>';
}

/* ================= PLAN TAB ================= */
function studyWindowMinutesToday(){
  const s = state.settings.studyWindowStart.split(':'); const e = state.settings.studyWindowEnd.split(':');
  const startMin = parseInt(s[0],10)*60+parseInt(s[1],10);
  const endMin = parseInt(e[0],10)*60+parseInt(e[1],10);
  return Math.max(0, endMin-startMin);
}
function busyMinutesForDate(dateObj){
  const day = dateObj.getDay();
  let total = 0;
  state.busyBlocks.filter(function(b){ return b.day===day; }).forEach(function(b){
    const s = b.start.split(':'); const e = b.end.split(':');
    const sm = parseInt(s[0],10)*60+parseInt(s[1],10);
    const em = parseInt(e[0],10)*60+parseInt(e[1],10);
    total += Math.max(0, em-sm);
  });
  return total;
}
function renderPlan(){
  const panel = document.getElementById('panel-plan');
  const upcoming = state.events.filter(function(e){ return e.date>=todayStr(); }).sort(function(a,b){ return a.date<b.date?-1:1; });
  const suggested = suggestedStudyMinutesToday();

  panel.innerHTML =
    '<div class="suggest-card" style="margin-bottom:20px;"><div class="insight-label" style="color:var(--success);">Suggested today</div>' +
    '<div class="insight-text">Based on your tuition schedule and study window, aim for about <b>' + (suggested/60).toFixed(1) + 'h</b> today.</div></div>' +

    '<p class="section-label">Upcoming</p>' +
    (upcoming.length ? upcoming.map(function(e){
      const subj = subjectById(e.subjectId);
      const daysUntil = Math.round((new Date(e.date) - new Date(todayStr()))/86400000);
      const when = daysUntil===0 ? 'Today' : daysUntil===1 ? 'Tomorrow' : daysUntil + ' days';
      const timeStr = e.time ? (' \u00b7 ' + fmtTimeLabel(e.time)) : '';
      const estStr = e.estMin ? (' \u00b7 ~' + e.estMin + ' min') : '';
      return '<div class="plan-entry" style="--entry-color:' + (subj?subj.color:'#888') + '">' +
        '<div class="plan-entry-info"><div class="title">' + e.title + '</div><div class="meta">' + (subj?subj.name:'') + ' &middot; ' + when + timeStr + estStr + '</div></div>' +
        '<div style="display:flex; align-items:center; gap:8px;"><span class="plan-badge ' + e.type + '">' + e.type + '</span><button class="del-btn" data-id="' + e.id + '">&times;</button></div>' +
      '</div>';
    }).join('') : '<div class="empty-state">Nothing coming up. Add an exam or homework entry below.</div>') +

    '<button class="btn btn-ghost" id="toggleAddPlan" style="font-size:12px; padding:8px 14px; margin-top:6px;">+ Update</button>' +
    '<div class="add-plan-form" id="addPlanForm">' +
      '<div class="type-row" id="typeRow">' +
        '<button class="type-btn" data-t="exam">Exam</button>' +
        '<button class="type-btn" data-t="homework">Homework</button>' +
        '<button class="type-btn" data-t="other">Other</button>' +
      '</div>' +
      '<select id="planSubjSelect">' +
        state.subjects.map(function(s){ return '<option value="' + s.id + '">' + s.name + '</option>'; }).join('') +
      '</select>' +
      '<input type="text" id="planTitleInput" placeholder="Title (e.g. Chapter 6, Midterm)">' +
      '<div class="field-row">' +
        '<div><div class="field-label">Date</div><input type="date" id="planDateInput"></div>' +
        '<div><div class="field-label">Time (optional)</div><input type="time" id="planTimeInput"></div>' +
      '</div>' +
      '<div><div class="field-label">Estimated time needed, minutes (optional)</div><input type="number" id="planEstInput" min="5" step="5" placeholder="e.g. 30"></div>' +
      '<button class="btn btn-primary" id="createPlanBtn" style="font-size:13px;">Add</button>' +
    '</div>' +

    '<p class="section-label" style="margin-top:24px;">Study window</p>' +
    '<div class="card"><p class="hint" style="text-align:left; margin:0 0 10px;">The hours you\u2019re realistically available to study each day \u2014 used for the suggestion above.</p>' +
    '<div class="field-row"><div><div class="field-label">Start</div><input type="time" id="windowStartInput" value="' + state.settings.studyWindowStart + '" style="width:100%; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text); border-radius:6px; padding:9px 10px;"></div>' +
    '<div><div class="field-label">End</div><input type="time" id="windowEndInput" value="' + state.settings.studyWindowEnd + '" style="width:100%; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text); border-radius:6px; padding:9px 10px;"></div></div>' +
    '<button class="btn btn-ghost" id="saveWindowBtn" style="font-size:12px; padding:7px 12px; margin-top:10px;">Save</button></div>' +

    '<p class="section-label" style="margin-top:24px;">Notifications &amp; sound</p>' +
    '<div class="card"><div class="notif-row"><span>Remind me about exams / homework due soon</span>' +
      '<button class="btn btn-ghost" id="notifBtn" style="font-size:12px; padding:7px 12px;">' + (state.settings.notifyEnabled ? 'Enabled' : 'Enable') + '</button></div>' +
      '<p class="hint" style="text-align:left; margin:8px 0 0;">Notifications only fire while Study Log is open in your browser.</p>' +
      '<div class="notif-row" style="margin-top:14px;"><span>Sound on timer events</span>' +
      '<button class="btn btn-ghost" id="soundBtn" style="font-size:12px; padding:7px 12px;">' + (state.settings.soundEnabled ? 'On' : 'Off') + '</button></div>' +
    '</div>';

  document.querySelectorAll('.del-btn[data-id]').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.events = state.events.filter(function(e){ return e.id !== btn.dataset.id; });
      storageSet(STORAGE_KEYS.events, state.events);
      renderPlan();
    });
  });
  document.querySelectorAll('#typeRow .type-btn').forEach(function(btn){
    btn.classList.toggle('active', btn.dataset.t===activePlanType);
    btn.addEventListener('click', function(){
      activePlanType = btn.dataset.t;
      document.querySelectorAll('#typeRow .type-btn').forEach(function(b){ b.classList.toggle('active', b===btn); });
    });
  });
  document.getElementById('toggleAddPlan').addEventListener('click', function(){
    document.getElementById('addPlanForm').classList.toggle('open');
  });
  document.getElementById('createPlanBtn').addEventListener('click', function(){
    const title = document.getElementById('planTitleInput').value.trim();
    const date = document.getElementById('planDateInput').value;
    const time = document.getElementById('planTimeInput').value;
    const estMin = parseInt(document.getElementById('planEstInput').value,10) || null;
    const subjectId = document.getElementById('planSubjSelect').value;
    if(!title || !date) return;
    state.events.push({ id:'ev'+Date.now(), subjectId, type: activePlanType, title, date, time: time||null, estMin: estMin });
    storageSet(STORAGE_KEYS.events, state.events);
    document.getElementById('planTitleInput').value='';
    document.getElementById('planDateInput').value='';
    document.getElementById('planTimeInput').value='';
    document.getElementById('planEstInput').value='';
    document.getElementById('addPlanForm').classList.remove('open');
    renderPlan();
    maybeNotifyUpcoming();
  });

  document.getElementById('saveWindowBtn').addEventListener('click', function(){
    const s = document.getElementById('windowStartInput').value;
    const e = document.getElementById('windowEndInput').value;
    if(s) state.settings.studyWindowStart = s;
    if(e) state.settings.studyWindowEnd = e;
    storageSet(STORAGE_KEYS.settings, state.settings);
    renderPlan();
  });

  document.getElementById('notifBtn').addEventListener('click', async function(){
    if(!('Notification' in window)){ this.textContent='Not supported'; return; }
    const perm = await Notification.requestPermission();
    state.settings.notifyEnabled = perm === 'granted';
    storageSet(STORAGE_KEYS.settings, state.settings);
    renderPlan();
    maybeNotifyUpcoming();
  });
  document.getElementById('soundBtn').addEventListener('click', function(){
    state.settings.soundEnabled = !state.settings.soundEnabled;
    storageSet(STORAGE_KEYS.settings, state.settings);
    if(state.settings.soundEnabled) beep(660,120);
    renderPlan();
  });
}
function renderBusyList(){
  const el = document.getElementById('busyList');
  if(!state.busyBlocks.length){ el.innerHTML = '<div class="empty-state" style="padding:16px 0;">No busy times added yet.</div>'; return; }
  const sorted = state.busyBlocks.slice().sort(function(a,b){ return a.day-b.day || (a.start<b.start?-1:1); });
  el.innerHTML = sorted.map(function(b){
    return '<div class="busy-entry"><div class="be-info"><div class="title">' + b.label + '</div><div class="meta">' + DAY_NAMES[b.day] + ' \u00b7 ' + fmtTimeLabel(b.start) + '\u2013' + fmtTimeLabel(b.end) + '</div></div><button class="del-btn" data-bb="' + b.id + '">&times;</button></div>';
  }).join('');
  el.querySelectorAll('.del-btn[data-bb]').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.busyBlocks = state.busyBlocks.filter(function(b){ return b.id!==btn.dataset.bb; });
      storageSet(STORAGE_KEYS.busyBlocks, state.busyBlocks);
      renderPlan();
    });
  });
}

function notifyLocal(title, body){
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  try{ new Notification(title, { body: body }); }catch(e){}
}
function maybeNotifyUpcoming(){
  if(!state.settings.notifyEnabled) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const todayS = todayStr(), tomorrowS = daysFromNowStr(1);
  state.events.filter(function(e){ return e.date===todayS || e.date===tomorrowS; }).forEach(function(e){
    const key = 'notified_'+e.id+'_'+e.date;
    if(localStorage.getItem(key)) return;
    const subj = subjectById(e.subjectId);
    notifyLocal('Study Log reminder', (subj?subj.name+' ':'') + e.type + ': ' + e.title + ' \u2014 ' + (e.date===todayS?'today':'tomorrow'));
    localStorage.setItem(key,'1');
  });
}

/* ================= STREAK POPUP ================= */
function maybeShowStreakPopup(){
  const last = storageGet(STORAGE_KEYS.lastPopup, null);
  const todayS = todayStr();
  if(last === todayS) return;
  const streak = calcStreak();
  if(streak < 1) { storageSet(STORAGE_KEYS.lastPopup, todayS); return; }
  storageSet(STORAGE_KEYS.lastPopup, todayS);
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML =
    '<div class="modal-card">' +
      '<div class="modal-flame">\uD83D\uDD25</div>' +
      '<div class="modal-streak">' + streak + '</div>' +
      '<div class="modal-sub">day streak. Keep it alive \u2014 log at least one session today.</div>' +
      '<button class="btn btn-primary" id="closeStreakPopup" style="width:100%;">Let\u2019s go</button>' +
    '</div>';
  document.body.appendChild(backdrop);
  function close(){ backdrop.remove(); }
  document.getElementById('closeStreakPopup').addEventListener('click', close);
  backdrop.addEventListener('click', function(e){ if(e.target===backdrop) close(); });
}

/* ================= SESSION HISTORY PANEL (bell icon) ================= */
let logDateFilter = null;
function buildSessionListHtml(){
  let sessions = state.sessions;
  if(logDateFilter){ sessions = sessions.filter(function(s){ return fmtDate(s.start)===logDateFilter; }); }
  const grouped = {};
  sessions.slice().sort(function(a,b){ return b.start-a.start; }).forEach(function(s){
    const d = fmtDate(s.start);
    (grouped[d]=grouped[d]||[]).push(s);
  });
  const dates = Object.keys(grouped).sort().reverse();
  if(dates.length===0){
    return '<div class="empty-state">' + (logDateFilter ? 'No sessions on that date.' : 'No sessions yet. Start a timer from the Track tab.') + '</div>';
  }
  return dates.map(function(date){
    const label = date===todayStr() ? 'Today' : new Date(date).toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
    const entries = grouped[date].map(function(s){
      const subj = subjectById(s.subjectId);
      return '<div class="log-entry" style="--entry-color:' + (subj?subj.color:'#888') + '">' +
        '<div class="log-entry-info"><span class="subj">' + (subj?subj.name:'Deleted subject') + '</span><span class="time">' + fmtTime(s.start) + ' \u2013 ' + fmtTime(s.end) + '</span></div>' +
        '<div style="display:flex; align-items:center; gap:10px;"><span class="log-entry-dur">' + s.durationMin + 'm</span><button class="del-btn" data-id="' + s.id + '" aria-label="Delete session">&times;</button></div>' +
      '</div>';
    }).join('');
    return '<div class="log-date-group"><div class="log-date-head">' + label + '</div>' + entries + '</div>';
  }).join('');
}
function renderSessionPanel(){
  const panel = document.getElementById('sessionPanel');
  panel.innerHTML =
    '<div class="session-panel-head"><h2>Session history</h2><button class="panel-close-btn" id="panelCloseBtn">&times;</button></div>' +
    '<div class="log-filter-row"><input type="date" id="logDateFilterInput" value="' + (logDateFilter||'') + '"><button class="btn btn-ghost" id="logResetBtn" style="font-size:12px; padding:9px 14px;">Reset</button></div>' +
    buildSessionListHtml();

  document.getElementById('panelCloseBtn').addEventListener('click', closeSessionPanel);
  document.getElementById('logDateFilterInput').addEventListener('change', function(){
    logDateFilter = this.value || null;
    renderSessionPanel();
  });
  document.getElementById('logResetBtn').addEventListener('click', function(){
    logDateFilter = null;
    renderSessionPanel();
  });
  panel.querySelectorAll('.del-btn[data-id]').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.sessions = state.sessions.filter(function(s){ return s.id!==btn.dataset.id; });
      storageSet(STORAGE_KEYS.sessions, state.sessions);
      renderAll();
      renderSessionPanel();
    });
  });
}

/* ================= LOG TAB (subjects + busy schedule) ================= */
function renderLog(){
  const panel = document.getElementById('panel-log');
  panel.innerHTML =
    '<div class="subj-manager"><p class="section-label">Subjects</p><ul class="subj-list" id="subjList"></ul>' +
    '<button class="btn btn-ghost" id="toggleAddSubj" style="font-size:12px; padding:8px 14px;">+ Add subject</button>' +
    '<div class="add-subj-form" id="addSubjForm">' +
      '<input type="text" id="newSubjName" placeholder="Subject name">' +
      '<div class="swatches" id="swatchRow"></div>' +
      '<button class="btn btn-primary" id="createSubjBtn" style="font-size:13px;">Add</button>' +
    '</div></div>' +

    '<div class="subj-manager"><p class="section-label">Weekly busy schedule (tuition etc.)</p>' +
    '<div id="busyList"></div>' +
    '<button class="btn btn-ghost" id="toggleAddBusy" style="font-size:12px; padding:8px 14px;">+ Add busy time</button>' +
    '<div class="add-plan-form" id="addBusyForm">' +
      '<div class="day-toggle-row" id="busyDayRow"></div>' +
      '<input type="text" id="busyLabelInput" placeholder="Label (e.g. Math tuition)">' +
      '<div class="field-row">' +
        '<div><div class="field-label">Start</div><input type="time" id="busyStartInput" value="17:00"></div>' +
        '<div><div class="field-label">End</div><input type="time" id="busyEndInput" value="19:00"></div>' +
      '</div>' +
      '<button class="btn btn-primary" id="createBusyBtn" style="font-size:13px;">Add</button>' +
    '</div></div>';

  const subjList = document.getElementById('subjList');
  subjList.innerHTML = state.subjects.map(function(s){
    return '<li><span class="subj-left"><span class="dot" style="background:' + s.color + '"></span>' + s.name + '</span><button class="del-btn" data-subj="' + s.id + '" aria-label="Delete subject">&times;</button></li>';
  }).join('');
  subjList.querySelectorAll('.del-btn[data-subj]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const id = btn.dataset.subj;
      state.subjects = state.subjects.filter(function(s){ return s.id!==id; });
      storageSet(STORAGE_KEYS.subjects, state.subjects);
      if(activeSubjectId===id) activeSubjectId = state.subjects[0] ? state.subjects[0].id : null;
      renderAll();
    });
  });

  let selectedSwatch = SWATCH_COLORS[0];
  const swatchRow = document.getElementById('swatchRow');
  swatchRow.innerHTML = SWATCH_COLORS.map(function(c,i){ return '<div class="swatch ' + (i===0?'sel':'') + '" style="background:' + c + '" data-c="' + c + '"></div>'; }).join('');
  swatchRow.querySelectorAll('.swatch').forEach(function(sw){
    sw.addEventListener('click', function(){
      selectedSwatch = sw.dataset.c;
      swatchRow.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('sel'); });
      sw.classList.add('sel');
    });
  });

  document.getElementById('toggleAddSubj').addEventListener('click', function(){
    document.getElementById('addSubjForm').classList.toggle('open');
  });
  document.getElementById('createSubjBtn').addEventListener('click', function(){
    const nameInput = document.getElementById('newSubjName');
    const name = nameInput.value.trim();
    if(!name) return;
    const id = 'subj'+Date.now();
    state.subjects.push({ id, name, color: selectedSwatch });
    storageSet(STORAGE_KEYS.subjects, state.subjects);
    if(!activeSubjectId) activeSubjectId = id;
    nameInput.value='';
    document.getElementById('addSubjForm').classList.remove('open');
    renderAll();
  });

  renderBusyList();
  const busyDayRow = document.getElementById('busyDayRow');
  busyDayRow.innerHTML = DAY_NAMES.map(function(d,i){ return '<button class="day-toggle ' + (i===activeBusyDay?'active':'') + '" data-d="' + i + '">' + d + '</button>'; }).join('');
  busyDayRow.querySelectorAll('.day-toggle').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeBusyDay = parseInt(btn.dataset.d,10);
      busyDayRow.querySelectorAll('.day-toggle').forEach(function(b){ b.classList.toggle('active', b===btn); });
    });
  });
  document.getElementById('toggleAddBusy').addEventListener('click', function(){
    document.getElementById('addBusyForm').classList.toggle('open');
  });
  document.getElementById('createBusyBtn').addEventListener('click', function(){
    const label = document.getElementById('busyLabelInput').value.trim() || 'Busy';
    const start = document.getElementById('busyStartInput').value;
    const end = document.getElementById('busyEndInput').value;
    if(!start || !end) return;
    state.busyBlocks.push({ id:'bb'+Date.now(), day: activeBusyDay, start, end, label });
    storageSet(STORAGE_KEYS.busyBlocks, state.busyBlocks);
    document.getElementById('busyLabelInput').value='';
    document.getElementById('addBusyForm').classList.remove('open');
    renderLog();
  });
}

/* ---------- boot ---------- */
init();

document.addEventListener('click', function(e){
  if(e.target.id==='startBtn') startTimer();
  if(e.target.id==='pauseBtn') (timer.phase==='running' ? pauseTimer() : resumeTimer());
  if(e.target.id==='stopBtn') stopTimer();
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && timer.phase==='running'){
    const active = storageGet(STORAGE_KEYS.activeTimer, null);
    if(active && active.phase==='running'){
      const elapsed = active.elapsedSec + Math.max(0, Math.floor((Date.now()-active.savedAt)/1000));
      if(timer.mode !== 'stopwatch' && elapsed >= timer.targetSec && timer.targetSec>0){
        timer.elapsedSec = timer.targetSec;
        handleTimerComplete();
      } else {
        timer.elapsedSec = elapsed;
        timer.lastTick = Date.now();
        updateTimerDisplay();
      }
    }
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
