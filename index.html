<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Study Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14151A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#14151A; --surface:#1C1E26; --surface-2:#24262F; --surface-3:#2B2E3A;
    --border:#2E313D; --border-strong:#3A3D4B;
    --text:#EDEBE3; --text-2:#9294A3; --text-3:#63656F;
    --accent:#E8A33D; --accent-dim:#3A2F1E;
    --success:#7FA875; --success-dim:#20281E;
    --danger:#D9705B; --danger-dim:#2E1E1B;
    --winter-accent:#7EC9E8; --winter-accent-2:#BFE8FA;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Bitter',serif;}
  .app{max-width:440px; margin:0 auto; padding-bottom:84px; min-height:100vh; position:relative;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 20px 16px; border-bottom:1px solid var(--border);
    gap:10px;
  }
  .topbar-left{display:flex; align-items:center; gap:10px;}
  .week-chip{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:16px;}
  .week-chip b{color:var(--text); font-weight:500;}
  .week-chip .delta{font-size:11.5px; font-weight:600; margin-left:auto;}
  .menu-btn{background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-2); flex:0 0 auto;}
  .menu-btn svg{width:18px; height:18px;}
  .brand{font-family:'Bitter',serif; font-weight:700; font-size:15px; letter-spacing:2px; color:var(--text);}
  .brand span{color:var(--accent);}
  .signature{
    font-family:'Dancing Script', cursive; font-weight:700; font-size:13px;
    margin-top:2px; margin-left:1px;
    background:linear-gradient(90deg, var(--text-3) 0%, var(--accent) 50%, var(--text-3) 100%);
    background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:sig-shimmer 3.5s ease-in-out infinite, sig-fadein 0.8s ease-out;
  }
  @keyframes sig-shimmer{
    0%{background-position:200% center;}
    100%{background-position:-200% center;}
  }
  @keyframes sig-fadein{
    from{opacity:0; transform:translateY(-3px);}
    to{opacity:1; transform:translateY(0);}
  }
  .loading-brand{font-family:'Bitter',serif; font-weight:700; font-size:18px; letter-spacing:2px; color:var(--text); margin-bottom:6px; animation:sig-fadein 0.6s ease-out;}
  .loading-brand span{color:var(--accent);}
  .loading-signature{font-family:'Dancing Script', cursive; font-weight:700; font-size:16px; color:var(--accent); animation:sig-fadein 0.9s ease-out;}
  .date-stamp{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-3);
    border:1px solid var(--border-strong); border-radius:4px; padding:4px 8px;
    transform:rotate(-1.5deg);
  }
  .topbar-right{display:flex; align-items:center; gap:10px;}
  .bell-btn{position:relative; background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-2);}
  .bell-btn svg{width:17px; height:17px;}
  .bell-badge{position:absolute; top:-5px; right:-5px; background:var(--danger); color:#fff; font-size:9.5px; font-weight:700; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; font-family:'Inter';}
  .session-panel-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:120; display:none;
  }
  .session-panel-backdrop.open{display:block;}
  .session-panel{
    position:absolute; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:440px;
    background:var(--bg); border-bottom:1px solid var(--border-strong); border-radius:0 0 16px 16px;
    max-height:88vh; overflow-y:auto; padding:18px 20px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  .session-panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .session-panel-head h2{font-family:'Bitter',serif; font-size:16px; font-weight:700; margin:0;}
  .panel-close-btn{background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text-2); border-radius:8px; width:30px; height:30px; font-size:16px; cursor:pointer; line-height:1;}

  /* left slide-out drawer */
  .drawer-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:130; display:none;}
  .drawer-backdrop.open{display:block;}
  .drawer{position:fixed; top:0; left:0; bottom:0; width:78%; max-width:300px; background:var(--surface); border-right:1px solid var(--border-strong); padding:24px 18px; transform:translateX(-100%); transition:transform 0.22s ease;}
  .drawer-backdrop.open .drawer{transform:translateX(0);}
  .drawer-title{font-family:'Bitter',serif; font-weight:700; font-size:16px; margin:0 0 20px;}
  .drawer-item{display:flex; align-items:center; gap:12px; padding:12px 8px; border-radius:8px; color:var(--text); font-size:14px; cursor:pointer; background:none; border:none; width:100%; text-align:left;}
  .drawer-item:hover{background:var(--surface-2);}
  .drawer-item svg{width:18px; height:18px; color:var(--text-2); flex:0 0 auto;}

  /* generic overlay panel (achievements / to-do) reusing the top-panel language */
  .overlay-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:120; display:none;}
  .overlay-backdrop.open{display:block;}
  .overlay-panel{
    position:absolute; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:440px;
    background:var(--bg); border-bottom:1px solid var(--border-strong); border-radius:0 0 16px 16px;
    max-height:88vh; overflow-y:auto; padding:18px 20px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }

  /* to-do list */
  .todo-add-row{display:flex; gap:8px; margin-bottom:16px;}
  .todo-add-row input{flex:1; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text); border-radius:8px; padding:9px 10px; font-family:'Inter'; font-size:13px;}
  .todo-item{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .todo-item:last-child{border-bottom:none;}
  .todo-check{width:20px; height:20px; border-radius:5px; border:1.5px solid var(--border-strong); background:var(--surface-2); flex:0 0 auto; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:13px;}
  .todo-check.checked{background:var(--accent); border-color:var(--accent); color:#1A1409;}
  .todo-text{flex:1; font-size:13.5px;}
  .todo-text.done{text-decoration:line-through; color:var(--text-3);}

  /* achievements */
  .ach-hero{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:18px; display:flex; align-items:center; gap:14px;}
  .ach-hero-icon{width:44px; height:44px; border-radius:10px; background:var(--accent-dim); display:flex; align-items:center; justify-content:center; color:var(--accent); flex:0 0 auto;}
  .ach-hero-icon svg{width:22px; height:22px;}
  .ach-hero .lbl{font-size:11.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:0.5px;}
  .ach-hero .val{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; margin-top:2px;}
  .ach-progress-track{background:var(--surface-3); border-radius:6px; height:8px; overflow:hidden; margin:8px 0 4px;}
  .ach-progress-fill{background:var(--accent); height:100%; border-radius:6px;}
  .ach-progress-label{font-size:11.5px; color:var(--text-3); text-align:center;}
  .badge-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:12px;}
  .badge{
    aspect-ratio:1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--surface-2); border:1px solid var(--border-strong); padding:8px; text-align:center;
  }
  .badge.unlocked{background:linear-gradient(160deg, var(--accent-dim), var(--surface-2)); border-color:var(--accent);}
  .badge .badge-num{font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:700; color:var(--text-3);}
  .badge.unlocked .badge-num{color:var(--accent);}
  .badge .badge-lbl{font-size:8.5px; text-transform:uppercase; letter-spacing:0.3px; color:var(--text-3); margin-top:2px;}
  .badge.unlocked .badge-lbl{color:var(--text-2);}
  .badge .badge-date{font-size:7.5px; color:var(--text-3); margin-top:3px;}

  .ach-popup-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:150; display:flex; align-items:center; justify-content:center; padding:24px;}
  .ach-popup-card{
    background:linear-gradient(165deg, #2B2410, var(--surface)); border:1px solid var(--accent); border-radius:18px;
    padding:32px 24px; text-align:center; max-width:320px; width:100%;
  }
  .ach-popup-unlocked{font-size:11px; letter-spacing:2px; color:var(--accent); text-transform:uppercase; margin-bottom:10px;}
  .ach-popup-num{font-family:'Bitter',serif; font-weight:700; font-size:40px; color:var(--text); line-height:1;}
  .ach-popup-sub{font-size:13px; color:var(--accent); text-transform:uppercase; letter-spacing:1px; margin-top:6px; font-weight:600;}
  .ach-popup-msg{font-size:12.5px; color:var(--text-2); margin-top:14px; line-height:1.5;}

  /* daily goals grid */
  .goal-set-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .goal-set-row .gs-left{display:flex; align-items:center; gap:8px;}
  .goal-set-row .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .goal-set-row input{width:64px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text); border-radius:6px; padding:6px 7px; font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:center;}
  .goalgrid-wrap{overflow-x:auto; margin:10px 0 4px; -webkit-overflow-scrolling:touch;}
  .goalgrid{border-collapse:collapse; font-size:10.5px;}
  .goalgrid th, .goalgrid td{padding:5px 4px; text-align:center; min-width:24px;}
  .goalgrid thead th{color:var(--text-3); font-weight:500; font-family:'IBM Plex Mono',monospace; font-size:9px; line-height:1.4;}
  .goalgrid .subj-cell{position:sticky; left:0; background:var(--bg); text-align:left; padding-right:10px; white-space:nowrap; font-size:11.5px; z-index:2;}
  .goalgrid .subj-cell .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px;}
  .goal-check{width:16px; height:16px; border-radius:4px; border:1px solid var(--border-strong); background:var(--surface-2); display:inline-flex; align-items:center; justify-content:center; font-size:10px; color:var(--success); margin:0 auto;}
  .goal-check.met{background:var(--success-dim); border-color:var(--success); color:var(--success);}
  .analysis-head-row{display:grid; grid-template-columns:1.5fr 0.7fr 0.6fr 1fr; gap:8px; font-size:10.5px; color:var(--text-3); padding-bottom:8px; border-bottom:1px solid var(--border-strong);}
  .analysis-row{display:grid; grid-template-columns:1.5fr 0.7fr 0.6fr 1fr; gap:8px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:12px;}
  .analysis-row .a-bar-track{background:var(--surface-3); border-radius:4px; height:6px; overflow:hidden;}
  .analysis-row .a-bar-fill{background:var(--accent); height:100%;}

  /* averages */
  .ring-chart-wrap{position:relative; width:220px; height:220px; margin:10px auto 16px;}
  .ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none;}
  .ring-center .rc-label{font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:0.5px;}
  .ring-center .rc-val{font-family:'Bitter',serif; font-weight:700; font-size:22px; margin-top:4px;}
  .avg-section{margin-bottom:26px;}
  .tap-hint{font-size:11px; color:var(--text-3); text-align:center; margin-top:-8px; margin-bottom:10px;}
  .weekday-bar-row{display:flex; align-items:flex-end; gap:6px; height:120px; margin:14px 0 4px;}
  .weekday-bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
  .weekday-bar{width:100%; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px;}
  .weekday-bar-lbl{font-size:10px; color:var(--text-3);}

  /* badge day-list drill down */
  .badge.clickable{cursor:pointer;}
  .day-row{border-bottom:1px solid var(--border);}
  .day-row:last-child{border-bottom:none;}
  .day-row-head{display:flex; align-items:center; justify-content:space-between; padding:11px 2px; cursor:pointer;}
  .day-row-head .drh-date{font-size:13px;}
  .day-row-head .drh-right{display:flex; align-items:center; gap:8px; color:var(--text-2); font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .day-row-arrow{transition:transform 0.15s; color:var(--text-3);}
  .day-row-arrow.open{transform:rotate(180deg);}
  .day-row-detail{display:none; padding:0 2px 12px;}
  .day-row-detail.open{display:block;}

  .tab-panel{padding:20px;}
  .section-label{
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--text-3); margin:0 0 10px; font-weight:500;
  }
  .section-label.with-arrow{display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
  .section-label .arrow{transition:transform 0.15s;}
  .section-label .arrow.open{transform:rotate(180deg);}

  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .chip{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:20px; border:1px solid var(--border-strong);
    background:var(--surface); font-size:13px; color:var(--text-2);
    white-space:nowrap; cursor:pointer;
  }
  .chip .dot{width:8px; height:8px; border-radius:50%;}
  .chip.active{border-color:var(--dot-color, var(--accent)); color:var(--text); background:var(--surface-2);}
  .chip.add-chip{color:var(--accent); border-style:dashed;}

  .trends-top-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .icon-toggle-btn{background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-2); flex:0 0 auto;}
  .icon-toggle-btn svg{width:16px; height:16px;}
  .trends-subj-select{
    background:var(--surface); border:1px solid var(--border-strong); color:var(--text); border-radius:8px;
    padding:7px 10px; font-family:'Inter'; font-size:12.5px; max-width:150px;
  }
  .period-row{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:3px; margin-bottom:14px;}
  .period-btn{flex:1; border:none; background:transparent; color:var(--text-2); font-size:12.5px; padding:8px 0; border-radius:6px; cursor:pointer; font-family:'Inter';}
  .period-btn.active{background:var(--accent); color:#1A1409; font-weight:600;}
  .period-btn:disabled{opacity:0.4;}

  .mode-settings{display:flex; flex-direction:column; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:18px;}
  .setting-line{display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--text-2);}
  .setting-line input{
    width:60px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
    border-radius:6px; padding:6px 8px; font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:center;
  }

  .timer-wrap{display:flex; flex-direction:column; align-items:center; margin:8px 0 24px;}
  .dial{position:relative; width:220px; height:220px;}
  .dial svg{transform:rotate(-90deg);}
  .dial-time{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column;
  }
  .dial-time .t{font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:500; letter-spacing:1px;}
  .dial-time .lap{font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:1px; margin-top:4px;}
  .timer-controls{display:flex; gap:10px; margin-top:20px;}
  .btn{
    font-family:'Inter',sans-serif; font-size:14px; font-weight:600; border:none;
    border-radius:var(--radius); padding:12px 22px; cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:#1A1409;}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--border-strong);}
  .btn-danger{background:var(--danger-dim); color:var(--danger); border:1px solid var(--danger);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .hint{font-size:12px; color:var(--text-3); text-align:center; margin-top:14px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px;}
  .card-row{display:flex; align-items:center; justify-content:space-between;}

  .today-list{list-style:none; margin:0; padding:0;}
  .today-list li{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;
  }
  .today-list li:last-child{border-bottom:none;}
  .sess-left{display:flex; align-items:center; gap:8px; color:var(--text-2);}
  .sess-left .dot{width:8px; height:8px; border-radius:50%;}
  .sess-dur{font-family:'IBM Plex Mono',monospace; color:var(--text);}

  .insight-card{
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:10px; padding:14px 16px; margin-top:4px;
  }
  .insight-card.urgent{border-left-color:var(--danger);}
  .insight-label{display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin-bottom:6px;}
  .insight-card.urgent .insight-label{color:var(--danger);}
  .insight-text{font-size:13.5px; line-height:1.6; color:var(--text); white-space:pre-line;}

  .ask-shruti-btn{width:100%; margin-top:10px; font-size:13px; padding:10px 0;}
  .quick-q-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .quick-q{font-size:12px; padding:7px 12px; border-radius:16px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text-2); cursor:pointer;}
  .shruti-answer{margin-top:12px; font-size:13.5px; line-height:1.6; background:var(--surface-2); border-radius:8px; padding:12px 14px; display:none; white-space:pre-line;}
  .shruti-answer.show{display:block;}
  .routine-inline{display:none; gap:8px; margin-top:10px; align-items:center;}
  .routine-inline.open{display:flex;}
  .routine-inline input{width:70px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text); border-radius:6px; padding:7px 8px; font-family:'IBM Plex Mono',monospace; font-size:13px;}

  .stat-hero{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:2px;}
  .stat-hero .val{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:500;}
  .delta{font-size:12px; font-weight:600;}
  .delta.up{color:var(--success);}
  .delta.down{color:var(--danger);}

  .chart-box{
    position:relative; height:180px; margin:14px 0;
    background-image:linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size:100% 25%, 12.5% 100%; background-position:0 0;
  }
  .chart-hint{font-size:11px; color:var(--text-3); text-align:center; margin:-8px 0 10px;}

  .legend-row{display:flex; flex-wrap:wrap; gap:12px; font-size:11.5px; color:var(--text-2); margin-bottom:6px;}
  .legend-row span{display:flex; align-items:center; gap:5px;}
  .legend-row .dot{width:9px; height:9px; border-radius:2px;}

  .breakdown-list{list-style:none; margin:0 0 16px; padding:0; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden;}

const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TOTAL_HOUR_MILESTONES = [1,3,5,10,15,25,50,75,100,150,200,250,400,500,750,1000];

/* ---------- storage ---------- */
function storageGet(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ console.error('read failed', key, e); return fallback; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ console.error('save failed', key, e); try{ showToast('Could not save \u2014 device storage may be full.', 5000); }catch(_){} return false; }
}

/* ---------- sound ---------- */
let startSoundEl = null;
function playStartSound(){
  if(!state.settings.soundEnabled) return;
  try{
    if(!startSoundEl) startSoundEl = new Audio('sound-start.mp3');
    startSoundEl.currentTime = 0;
    startSoundEl.play().catch(function(){});
  }catch(e){}
}
let audioCtx = null;
function beep(freq, dur, vol){
  if(!state.settings.soundEnabled) return;
  freq = freq||660; dur = dur||150; vol = vol||0.16;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq; osc.type='sine';
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur/1000);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur/1000);
  }catch(e){}
}
function beepPattern(notes){
  let t = 0;
  notes.forEach(function(n){ setTimeout(function(){ beep(n[0], n[1]); }, t); t += n[2]||n[1]+40; });
}

/* ---------- timer state machine: crash-proof via persisted absolute checkpoints ---------- */
let timer = { mode:'stopwatch', phase:'idle', isBreak:false, elapsedSec:0, targetSec:0, lastTick:null };

function persistActiveTimer(){
  if(timer.phase==='idle'){ localStorage.removeItem(STORAGE_KEYS.activeTimer); return; }
  storageSet(STORAGE_KEYS.activeTimer, {
    subjectId: activeSubjectId, mode: timer.mode, isBreak: timer.isBreak,
    targetSec: timer.targetSec, elapsedSec: timer.elapsedSec, phase: timer.phase,
    savedAt: Date.now()
  });
}
function clearActiveTimer(){ localStorage.removeItem(STORAGE_KEYS.activeTimer); }

setInterval(function(){
  if(timer.phase !== 'running' || timer.lastTick == null) return;
  const now = Date.now();
  const delta = Math.floor((now - timer.lastTick)/1000);
  if(delta < 1) return;
  timer.lastTick += delta*1000;
  timer.elapsedSec += delta;
  persistActiveTimer();
  if(timer.mode !== 'stopwatch' && timer.elapsedSec >= timer.targetSec){
    timer.elapsedSec = timer.targetSec;
    updateTimerDisplay();
    handleTimerComplete();
    return;
  }
  updateTimerDisplay();
}, 1000);

function pad(n){ return String(n).padStart(2,'0'); }
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function parseLocalDate(s){
  if(typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s)){ const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  return new Date(s);
}
function fmtDate(d){ const x=new Date(d); return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); }
function fmtTime(d){ const x=new Date(d); let h=x.getHours(); const m=pad(x.getMinutes()); const ap=h>=12?'pm':'am'; h=h%12; if(h===0)h=12; return h+':'+m+ap; }
function todayStr(){ return fmtDate(new Date()); }
function daysAgoStr(n){ const d=new Date(); d.setDate(d.getDate()-n); return fmtDate(d); }
function daysFromNowStr(n){ const d=new Date(); d.setDate(d.getDate()+n); return fmtDate(d); }
function minutesToH(min){ return (min/60).toFixed(1)+'h'; }
function isEventUpcoming(e){
  const todayS = todayStr();
  if(e.date > todayS) return true;
  if(e.date < todayS) return false;
  if(!e.time) return true;
  return new Date(e.date + 'T' + e.time).getTime() >= Date.now();
}
function subjectById(id){ return state.subjects.find(function(s){ return s.id===id; }); }
function formatElapsed(totalSeconds){
  totalSeconds = Math.max(0, totalSeconds);
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  return h>0 ? (h+':'+pad(m)+':'+pad(s)) : (pad(m)+':'+pad(s));
}
function fmtTimeLabel(hhmm){
  const parts = hhmm.split(':'); let h = parseInt(parts[0],10); const m = parts[1];
  const ap = h>=12?'pm':'am'; h = h%12; if(h===0) h=12;
  return h+':'+m+ap;
}

function calcStreak(){
  const dateSet = new Set(state.sessions.map(function(s){ return fmtDate(s.start); }));
  let streak=0;
  let cursor = new Date();
  if(!dateSet.has(fmtDate(cursor))) cursor.setDate(cursor.getDate()-1);
  while(dateSet.has(fmtDate(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function showToast(msg, ms){
  const t = document.getElementById('toast');
  t.innerHTML = '';
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(function(){ t.classList.remove('show'); }, ms||3500);
}
function showUndoToast(msg, undoFn){
  const t = document.getElementById('toast');
  clearTimeout(t._hideTimer);
  t.innerHTML = '<span>' + msg + '</span><button class="undo-btn" id="undoBtn">Undo</button>';
  t.classList.add('show');
  document.getElementById('undoBtn').addEventListener('click', function(){
    t.classList.remove('show');
    clearTimeout(t._hideTimer);
    undoFn();
  });
  t._hideTimer = setTimeout(function(){ t.classList.remove('show'); }, 5000);
}

/* ---------- init with crash-recovery ---------- */
function init(){
  state.subjects = storageGet(STORAGE_KEYS.subjects, DEFAULT_SUBJECTS);
  if(!state.subjects.length) state.subjects = DEFAULT_SUBJECTS;
  state.sessions = storageGet(STORAGE_KEYS.sessions, []);
  state.settings = {...DEFAULT_SETTINGS, ...storageGet(STORAGE_KEYS.settings, {})};
  state.events = storageGet(STORAGE_KEYS.events, []);
  state.busyBlocks = storageGet(STORAGE_KEYS.busyBlocks, []);
  state.todos = storageGet(STORAGE_KEYS.todos, []);
  todoRolloverCheck();
  state.achievements = storageGet(STORAGE_KEYS.achievements, {total:{}, daily:{}});
  state.winterTargets = storageGet(STORAGE_KEYS.winterTargets, []);
  state.winterLogs = storageGet(STORAGE_KEYS.winterLogs, {});
  state.winterNotes = storageGet(STORAGE_KEYS.winterNotes, {});
  backfillAchievements();
  timer.mode = state.settings.timerMode || 'stopwatch';
  activeSubjectId = null;

  const active = storageGet(STORAGE_KEYS.activeTimer, null);
  if(active && subjectById(active.subjectId)){
    activeSubjectId = active.subjectId;
    timer.mode = active.mode; timer.isBreak = !!active.isBreak; timer.targetSec = active.targetSec||0;
    let elapsed = active.elapsedSec||0;
    if(active.phase === 'running'){
      elapsed += Math.max(0, Math.floor((Date.now() - active.savedAt)/1000));
    }
    if(timer.mode !== 'stopwatch' && elapsed >= timer.targetSec && timer.targetSec>0){
      timer.elapsedSec = timer.targetSec;
      timer.phase = 'running';
      timer.lastTick = Date.now();
      pendingCompletionOnLoad = true;
    } else {
      timer.elapsedSec = Math.max(0, elapsed);
      timer.phase = active.phase === 'paused' ? 'paused' : 'running';
      timer.lastTick = Date.now();
    }
  }

  buildShell();
  if(pendingCompletionOnLoad){
    pendingCompletionOnLoad = false;
    handleTimerComplete();
  } else {
    renderAll();
  }
  maybeShowStreakPopup();
  maybeNotifyUpcoming();
}

function updateBellBadge(){
  const badge = document.getElementById('bellBadge');
  if(!badge) return;
  const count = state.sessions.filter(function(s){ return fmtDate(s.start)===todayStr(); }).length;
  if(count>0){ badge.textContent = count>9?'9+':String(count); badge.style.display='flex'; }
  else { badge.style.display='none'; }
}

function switchTab(tab){
  activeTab = tab;
  if(tab !== 'trends'){ chartTypeMode = 'bar'; trendsSubjectFilter = 'all'; }
  ['track','trends','plan','log'].forEach(function(t){
    document.getElementById('panel-'+t).hidden = t!==tab;
  });
  document.querySelectorAll('.tab-item').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tab); });
  if(tab==='trends') renderTrends();
  if(tab==='plan') renderPlan();
}

function renderAll(){
  renderTrack();
  if(activeTab==='trends') renderTrends();
  if(activeTab==='plan') renderPlan();
  renderLog();
  updateBellBadge();
}

function textColorFor(hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b)/255;
  return luminance > 0.55 ? '#1A1409' : '#F5F3EC';
}

function updateTimerDisplay(){

  if(!disp || !arc) return;
  const circumference = 616;
  let shown, frac;
  if(timer.mode === 'stopwatch'){
    shown = timer.elapsedSec;
    const lapSec = Math.max(60, state.settings.focusMin*60);
    frac = (timer.elapsedSec % lapSec) / lapSec;
  } else {
    const remaining = Math.max(0, timer.targetSec - timer.elapsedSec);
    shown = remaining;
    frac = timer.targetSec>0 ? (1 - remaining/timer.targetSec) : 0;
  }
  disp.textContent = formatElapsed(shown);
  arc.setAttribute('stroke-dashoffset', String(circumference*(1-frac)));

function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

let wakeLockRef = null;
async function acquireWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLockRef = await navigator.wakeLock.request('screen');
      wakeLockRef.addEventListener('release', function(){ wakeLockRef = null; });
    }
  }catch(e){ wakeLockRef = null; }
}
function releaseWakeLock(){
  try{ if(wakeLockRef){ wakeLockRef.release(); wakeLockRef = null; } }catch(e){}
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && timer.phase==='running' && !wakeLockRef){
    acquireWakeLock();
  }
});

function startTimer(){
  if(!activeSubjectId || timer.phase !== 'idle') return;
  timer.elapsedSec = 0;
  timer.isBreak = false;
  timer.targetSec = timer.mode==='stopwatch' ? 0 : state.settings.focusMin*60;
  timer.phase = 'running';
  timer.lastTick = Date.now();
  persistActiveTimer();
  playStartSound();
  vibrate(40);
  acquireWakeLock();
  updateTimerButtons();
  updateTimerDisplay();
}
function pauseTimer(){
  if(timer.phase !== 'running') return;
  timer.phase = 'paused';
  persistActiveTimer();
  vibrate(25);
  releaseWakeLock();
  updateTimerButtons();
}
function resumeTimer(){
  if(timer.phase !== 'paused') return;
  timer.phase = 'running';
  timer.lastTick = Date.now();
  persistActiveTimer();
  vibrate(25);
  acquireWakeLock();
  updateTimerButtons();
}
function stopTimer(){
  const durationMin = Math.round(timer.elapsedSec/60);
  let logged = false;
  if(durationMin >= 1 && !timer.isBreak){
    const end = Date.now();
    const start = end - timer.elapsedSec*1000;
    state.sessions.push({ id:'s'+Date.now(), subjectId: activeSubjectId, start, end, durationMin });
    storageSet(STORAGE_KEYS.sessions, state.sessions);
    logged = true;
  }
  timer.phase='idle'; timer.elapsedSec=0; timer.targetSec=0; timer.lastTick=null; timer.isBreak=false;
  clearActiveTimer();
  beep(440,220);
  vibrate([30,40,30]);
  releaseWakeLock();
  if(logged){ checkLadderProgress(); checkAchievements(); }
  renderAll();
}
function handleTimerComplete(){
  const durationMin = Math.round(timer.elapsedSec/60);
  let logged = false;
  if(durationMin >= 1 && !timer.isBreak){
    const end = Date.now();
    const start = end - timer.elapsedSec*1000;
    state.sessions.push({ id:'s'+Date.now(), subjectId: activeSubjectId, start, end, durationMin });
    storageSet(STORAGE_KEYS.sessions, state.sessions);
    logged = true;
  }
  if(timer.mode === 'pomodoro'){
    timer.isBreak = !timer.isBreak;
    timer.elapsedSec = 0;
    timer.targetSec = timer.isBreak ? state.settings.breakMin*60 : state.settings.focusMin*60;
    timer.phase = 'paused';
    persistActiveTimer();
    releaseWakeLock();
    vibrate([30,40,30]);
    if(timer.isBreak){ beepPattern([[880,120],[880,120]]); notifyLocal('Study Log', 'Focus block done \u2014 take a ' + state.settings.breakMin + ' min break.'); }
    else { beepPattern([[660,150]]); notifyLocal('Study Log', 'Break\u2019s over \u2014 tap Resume for the next focus block.'); }
  } else {
    timer.phase='idle'; timer.elapsedSec=0; timer.targetSec=0; timer.lastTick=null;
    clearActiveTimer();
    releaseWakeLock();
    vibrate([30,40,30]);
    beepPattern([[660,140],[880,220]]);
    notifyLocal('Study Log', 'Timer complete.');
  }
  if(logged){ checkLadderProgress(); checkAchievements(); }
  renderAll();
}

/* ---------- personal-record ladder ---------- */
function checkLadderProgress(){
  const todayS = todayStr();
  const todayTotal = state.sessions.filter(function(s){ return fmtDate(s.start)===todayS; }).reduce(function(a,s){ return a+s.durationMin; },0);
  const byDay = {};
  state.sessions.forEach(function(s){ const d=fmtDate(s.start); if(d!==todayS) byDay[d]=(byDay[d]||0)+s.durationMin; });
  const ladder = Object.values(byDay).sort(function(a,b){ return a-b; });
  if(ladder.length===0) return;
  const rungsBeaten = ladder.filter(function(v){ return todayTotal > v; }).length;
  const key = 'ladderRungsBeaten_'+todayS;
  const prevBeaten = parseInt(localStorage.getItem(key)||'0',10);
  if(rungsBeaten > prevBeaten){
    localStorage.setItem(key, String(rungsBeaten));
    const isBest = todayTotal > ladder[ladder.length-1];
    if(isBest){
      showToast('\uD83C\uDFC6 New personal best day \u2014 ' + minutesToH(todayTotal) + '!', 4500);
    }else{
      showToast('\uD83D\uDE80 You just beat your ' + ordinal(ladder.length - rungsBeaten + 1) + ' lowest study day!', 4000);
    }
  }
}
function ordinal(n){
  const s=['th','st','nd','rd']; const v=n%100;
  return n + (s[(v-20)%10]||s[v]||s[0]);
}

function backfillAchievements(){
  const allTimeHours = state.sessions.reduce(function(a,s){ return a+s.durationMin; },0)/60;
  const todayHours = state.sessions.filter(function(s){ return fmtDate(s.start)===todayStr(); }).reduce(function(a,s){ return a+s.durationMin; },0)/60;
  let changed = false;
  TOTAL_HOUR_MILESTONES.forEach(function(m){

  });

}

/* ---------- shared date-math for averages & milestone day-counts ---------- */
function firstSessionDate(){
  if(!state.sessions.length) return null;
  return state.sessions.reduce(function(min,s){ const d=fmtDate(s.start); return (!min||d<min)?d:min; }, null);
}
function daysElapsedSinceFirst(){
  const first = firstSessionDate();
  if(!first) return 1;
  return Math.max(1, Math.round((parseLocalDate(todayStr()) - parseLocalDate(first))/86400000)+1);
}
function weeksElapsedSinceFirst(){ return Math.max(1, Math.ceil(daysElapsedSinceFirst()/7)); }
function monthsElapsedSinceFirst(){
  const first = firstSessionDate();
  if(!first) return 1;
  const f = parseLocalDate(first), n = parseLocalDate(todayStr());
  return Math.max(1, (n.getFullYear()-f.getFullYear())*12 + (n.getMonth()-f.getMonth()) + 1);
}
function yearsElapsedSinceFirst(){
  const first = firstSessionDate();
  if(!first) return 1;
  return Math.max(1, parseLocalDate(todayStr()).getFullYear() - parseLocalDate(first).getFullYear() + 1);
}
function weekdayOccurrencesSinceFirst(weekdayIdx){
  const first = firstSessionDate();
  if(!first) return 1;
  let count=0;
  let cursor = parseLocalDate(first);
  const end = parseLocalDate(todayStr());
  while(cursor<=end){
    if(cursor.getDay()===weekdayIdx) count++;
    cursor.setDate(cursor.getDate()+1);
  }
  return Math.max(1,count);
}
function periodDenominator(period){
  if(period==='day') return daysElapsedSinceFirst();
  if(period==='week') return weeksElapsedSinceFirst();
  if(period==='month') return monthsElapsedSinceFirst();
  return yearsElapsedSinceFirst();
}
/* exact distinct-study-days count at the moment each total-hour milestone was first reached */
function daysReachingThreshold(hoursThreshold){
  const byDay = {};
  state.sessions.forEach(function(s){ const d=fmtDate(s.start); byDay[d]=(byDay[d]||0)+s.durationMin; });
  return Object.entries(byDay).filter(function(e){ return e[1] >= hoursThreshold*60; })
    .map(function(e){ return { date:e[0], min:e[1] }; })
    .sort(function(a,b){ return b.date<a.date?-1:1; });
}
function computeDaysToMilestones(){
  const sorted = state.sessions.slice().sort(function(a,b){ return a.start-b.start; });
  let cumMin = 0;
  const daysSeen = new Set();
  const daysToReach = {};
  let nextIdx = 0;
  sorted.forEach(function(s){
    cumMin += s.durationMin;
    daysSeen.add(fmtDate(s.start));
    while(nextIdx < TOTAL_HOUR_MILESTONES.length && cumMin >= TOTAL_HOUR_MILESTONES[nextIdx]*60){
      daysToReach[TOTAL_HOUR_MILESTONES[nextIdx]] = daysSeen.size;
      nextIdx++;
    }
  });
  return daysToReach;
}

function gatherAllData(){
  return {
    exportedAt: new Date().toISOString(),
    subjects: state.subjects, sessions: state.sessions, settings: state.settings,
    events: state.events, busyBlocks: state.busyBlocks, todos: state.todos, achievements: state.achievements
  };
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function exportAllDataJson(){
  downloadFile('study-log-backup-' + todayStr() + '.json', JSON.stringify(gatherAllData(), null, 2), 'application/json');
}
function exportSessionsCsv(){
  const rows = [['Subject','Date','Start','End','Duration (min)']];
  state.sessions.slice().sort(function(a,b){ return a.start-b.start; }).forEach(function(s){
    const subj = subjectById(s.subjectId);
    rows.push([subj?subj.name:'Deleted subject', fmtDate(s.start), fmtTime(s.start), fmtTime(s.end), s.durationMin]);
  });
  const csv = rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  downloadFile('study-log-sessions-' + todayStr() + '.csv', csv, 'text/csv');
}
function importAllDataJson(jsonStr){
  try{
    const data = JSON.parse(jsonStr);
    if(!data || typeof data !== 'object') return false;
    if(Array.isArray(data.subjects)) storageSet(STORAGE_KEYS.subjects, data.subjects);
    if(Array.isArray(data.sessions)) storageSet(STORAGE_KEYS.sessions, data.sessions);
    if(data.settings) storageSet(STORAGE_KEYS.settings, data.settings);
    if(Array.isArray(data.events)) storageSet(STORAGE_KEYS.events, data.events);
    if(Array.isArray(data.busyBlocks)) storageSet(STORAGE_KEYS.busyBlocks, data.busyBlocks);
    if(Array.isArray(data.todos)) storageSet(STORAGE_KEYS.todos, data.todos);
    if(data.achievements) storageSet(STORAGE_KEYS.achievements, data.achievements);
    return true;
  }catch(e){ return false; }
}

function subjectMetGoalOnDate(subj, dateStr){
  if(!subj.dailyGoalMin) return null;
  const min = state.sessions.filter(function(s){ return s.subjectId===subj.id && fmtDate(s.start)===dateStr; }).reduce(function(a,s){ return a+s.durationMin; },0);
  return min >= subj.dailyGoalMin;
}
function renderGoalsOverlay(){
  const panel = document.getElementById('overlayPanel');
  const now = new Date();
  const ref = new Date(now.getFullYear(), now.getMonth()-goalMonthOffset, 1);
  const year = ref.getFullYear(), month = ref.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const isCurrentMonth = goalMonthOffset===0;
  const monthLabel = ref.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const todayS = todayStr();
  const daysElapsed = isCurrentMonth ? now.getDate() : daysInMonth;

  let dayHeaders = '';
  const dateStrs = [];
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const dateStr = fmtDate(dateObj);
    dateStrs.push(dateStr);
    dayHeaders += '<th>' + dateObj.toLocaleDateString('en-US',{weekday:'narrow'}) + '<br>' + d + '</th>';
  }

  const bodyRows = state.subjects.map(function(subj){
    const cells = dateStrs.map(function(dateStr){
      if(dateStr > todayS) return '<td></td>';
      const met = subjectMetGoalOnDate(subj, dateStr);
      if(met===null) return '<td style="color:var(--text-3);">\u2013</td>';
      return '<td><span class="goal-check ' + (met?'met':'') + '">' + (met?'\u2713':'') + '</span></td>';
    }).join('');
    return '<tr><td class="subj-cell"><span class="dot" style="background:' + subj.color + '"></span>' + esc(subj.name) + '</td>' + cells + '</tr>';
  }).join('');

  let totalMet = 0, totalPossible = 0;
  const analysisRows = state.subjects.map(function(subj){
    if(!subj.dailyGoalMin){
      return '<div class="analysis-row"><span>' + esc(subj.name) + '</span><span class="mono" style="color:var(--text-3);">\u2013</span><span class="mono" style="color:var(--text-3);">\u2013</span><span class="hint" style="margin:0; text-align:left;">No goal set</span></div>';
    }
    let met = 0;
    for(let i=0;i<daysElapsed;i++){ if(subjectMetGoalOnDate(subj, dateStrs[i])) met++; }
    totalMet += met; totalPossible += daysElapsed;
    const pct = daysElapsed ? Math.round((met/daysElapsed)*100) : 0;
    return '<div class="analysis-row"><span>' + esc(subj.name) + '</span><span class="mono">' + daysElapsed + '</span><span class="mono">' + met + '</span><div class="a-bar-track"><div class="a-bar-fill" style="width:' + pct + '%;"></div></div></div>';
  }).join('');
  const overallPct = totalPossible ? Math.round((totalMet/totalPossible)*100) : 0;

  panel.innerHTML =
    '<div class="session-panel-head"><h2>Daily Goals</h2><button class="panel-close-btn" id="panelCloseBtn2">&times;</button></div>' +

    '<p class="section-label">Daily minutes goal per subject</p>' +
    state.subjects.map(function(s){
      return '<div class="goal-set-row"><span class="gs-left"><span class="dot" style="background:' + s.color + '"></span>' + esc(s.name) + '</span><div style="display:flex; align-items:center; gap:6px;"><input type="number" min="0" step="5" value="' + (s.dailyGoalMin||'') + '" data-goalsubj="' + s.id + '" placeholder="off"><span style="color:var(--text-3); font-size:11px;">min/day</span></div></div>';
    }).join('') +

    '<div class="punch-head" style="margin-top:18px;"><p class="section-label" style="margin:0;">' + monthLabel + '</p><div style="display:flex; gap:6px;"><button class="punch-nav" id="goalMonthPrev">&lsaquo;</button><button class="punch-nav" id="goalMonthNext" ' + (isCurrentMonth?'disabled':'') + '>&rsaquo;</button></div></div>' +
    '<div class="goalgrid-wrap"><table class="goalgrid"><thead><tr><th class="subj-cell">Subject</th>' + dayHeaders + '</tr></thead><tbody>' + bodyRows + '</tbody></table></div>' +

    '<p class="section-label" style="margin-top:22px;">Analysis \u00b7 ' + monthLabel + '</p>' +
    '<div class="card"><div class="analysis-head-row"><span>Subject</span><span>Days</span><span>Met</span><span>Progress</span></div>' +
    analysisRows +
    '<div class="stat-hero" style="margin-top:14px;"><span class="section-label" style="margin:0;">Overall</span><span class="delta up">' + overallPct + '%</span></div></div>';

  document.getElementById('panelCloseBtn2').addEventListener('click', closeOverlay);
  document.getElementById('goalMonthPrev').addEventListener('click', function(){ goalMonthOffset++; renderGoalsOverlay(); });
  document.getElementById('goalMonthNext').addEventListener('click', function(){ goalMonthOffset = Math.max(0, goalMonthOffset-1); renderGoalsOverlay(); });
  panel.querySelectorAll('[data-goalsubj]').forEach(function(inp){
    inp.addEventListener('change', function(){
      const subj = subjectById(inp.dataset.goalsubj);
      if(subj){
        const v = parseInt(inp.value,10);
        subj.dailyGoalMin = (v && v>0) ? v : null;
        storageSet(STORAGE_KEYS.subjects, state.subjects);
        renderGoalsOverlay();
      }
    });
  });
}

      storageSet(STORAGE_KEYS.todos, state.todos);
      renderTodoOverlay();

function addTodo(){
  const input = document.getElementById('todoInput');
  const text = input.value.trim();
  if(!text) return;
  state.todos.push({ id:'td'+Date.now(), text, done:false });
  storageSet(STORAGE_KEYS.todos, state.todos);
  input.value='';
  renderTodoOverlay();
}


/* Shruti insight */
function renderInsight(){
  const card = document.getElementById('insightCard');
  const todayS = todayStr(), tomorrowS = daysFromNowStr(1);
  const urgent = state.events.filter(function(e){ return isEventUpcoming(e) && (e.date===todayS || e.date===tomorrowS); })
    .sort(function(a,b){ return a.date<b.date?-1:1; });

  let text, isUrgent=false;
  if(urgent.length){
    const sorted = urgent.slice().sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?-1:1;
      if(!!a.priority !== !!b.priority) return a.priority ? -1 : 1;
      return (a.type==='exam'?0:1) - (b.type==='exam'?0:1);
    });
    const e = sorted[0];
    const subj = subjectById(e.subjectId);
    const when = e.date===todayS ? 'today' : 'tomorrow';
    const timeStr = e.time ? (' at ' + fmtTimeLabel(e.time)) : '';
    const moreStr = sorted.length>1 ? (' You also have ' + (sorted.length-1) + ' more coming up \u2014 check the Plan tab.') : '';
    text = (subj?esc(subj.name):'Your') + ' ' + e.type + ' \u201c' + esc(e.title) + '\u201d is ' + when + timeStr + '. ' + (e.type==='exam' ? 'Good time to review it.' : 'Make sure it\u2019s done in time.') + moreStr;
    isUrgent = true;
  } else {
    const todayMin = state.sessions.filter(function(s){ return fmtDate(s.start)===todayStr(); }).reduce(function(a,s){ return a+s.durationMin; },0);
    const last7 = [1,2,3,4,5,6,7].map(function(n){ return state.sessions.filter(function(s){ return fmtDate(s.start)===daysAgoStr(n); }).reduce(function(a,s){ return a+s.durationMin; },0); });
    const avg7 = last7.reduce(function(a,b){return a+b;},0)/7;
    const streak = calcStreak();
    const bySubject = {};
    state.sessions.forEach(function(s){ (bySubject[s.subjectId]=bySubject[s.subjectId]||[]).push(s.durationMin); });
    let longFlag=null;
    Object.entries(bySubject).forEach(function(entry){
      const durs=entry[1];
      if(durs.length>=3 && durs.reduce(function(a,b){return a+b;},0)/durs.length>45) longFlag=subjectById(entry[0]);
    });

    if(state.sessions.length===0){
      text = 'Log your first session and I\u2019ll start spotting patterns in your study habits.';
    }else if(longFlag){
      text = 'Your ' + esc(longFlag.name) + ' sessions average over 45 minutes. Try splitting them with a short break in between.';
    }else if(streak>=5){
      text = streak + '-day streak. That kind of consistency is what actually moves the needle.';
    }else if(avg7>0 && todayMin > avg7*1.3){
      text = 'You\u2019ve already beaten your 7-day average today \u2014 good day to tackle the subject you\u2019ve been avoiding.';
    }else if(streak===0){
      text = 'No session logged today yet. Even 15 minutes keeps the pattern going.';
    }else{
      text = 'Nothing urgent on your plate \u2014 a good day to get ahead on your weakest subject.';
    }
  }
  card.className = 'insight-card' + (isUrgent ? ' urgent' : '');
  card.innerHTML = '<div class="insight-label">' + (isUrgent ? 'Coming up' : 'Weekly pattern') + '</div><div class="insight-text">' + text + '</div>';
}

function sumForRange(startDate, endDate){
  return state.sessions.filter(function(s){ const d=fmtDate(s.start); return d>=startDate && d<=endDate; }).reduce(function(a,s){ return a+s.durationMin; },0);
}
function shrutiWeekAnswer(){
  const thisWeek = sumForRange(daysAgoStr(6), todayStr());
  const lastWeek = sumForRange(daysAgoStr(13), daysAgoStr(7));
  if(thisWeek===0) return 'Nothing logged this week yet \u2014 start a session whenever you\u2019re ready.';
  if(lastWeek===0) return 'You\u2019ve logged ' + minutesToH(thisWeek) + ' this week. No comparison yet for last week.';
  const pct = Math.round(((thisWeek-lastWeek)/lastWeek)*100);
  return 'You\u2019ve logged ' + minutesToH(thisWeek) + ' this week, ' + (pct>=0?'up ':'down ') + Math.abs(pct) + '% vs last week.';
}
function suggestedStudyMinutesToday(){
  const win = studyWindowMinutesToday();
  const busyToday = busyMinutesForDate(new Date());
  const free = Math.max(0, win - busyToday);
  return Math.min(480, Math.max(240, free>0?free:240));
}
function shrutiTodayAnswer(){
  const todayS = todayStr(), tomorrowS = daysFromNowStr(1);
  const urgent = state.events.filter(function(e){ return isEventUpcoming(e) && (e.date===todayS || e.date===tomorrowS); })
    .sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?-1:1;
      if(!!a.priority !== !!b.priority) return a.priority ? -1 : 1;
      return (a.type==='exam'?0:1) - (b.type==='exam'?0:1);
    });
  if(urgent.length){
    const subj = subjectById(urgent[0].subjectId);
    const moreStr = urgent.length>1 ? (' You also have ' + (urgent.length-1) + ' more due soon \u2014 check the Plan tab.') : '';
    return 'Prioritize ' + (subj?subj.name:'that subject') + ' \u2014 you have a ' + urgent[0].type + ' due ' + (urgent[0].date===todayS?'today':'tomorrow') + '.' + moreStr;
  }
  const totals = {};
  state.subjects.forEach(function(s){ totals[s.id]=0; });
  state.sessions.filter(function(s){ return fmtDate(s.start)>=daysAgoStr(6); }).forEach(function(s){ if(totals[s.subjectId]!=null) totals[s.subjectId]+=s.durationMin; });
  let least=null;
  state.subjects.forEach(function(s){ if(least===null || totals[s.id]<totals[least.id]) least=s; });
  return least ? (least.name + ' has had the least attention this week \u2014 good one to pick up today.') : 'Add a subject first, then I can point you somewhere.';
}
function shrutiUpcomingAnswer(){
  const upcoming = state.events.filter(isEventUpcoming).sort(function(a,b){ return a.date<b.date?-1:1; }).slice(0,3);
  if(!upcoming.length) return 'Nothing logged yet \u2014 add an exam or homework entry in the Plan tab.';
  return upcoming.map(function(e){
    const subj = subjectById(e.subjectId);
    return (subj?subj.name:'') + ' ' + e.type + ': ' + e.title + ' (' + e.date + (e.time?' '+fmtTimeLabel(e.time):'') + ')';
  }).join('\n');
}
function shrutiStreakAnswer(){
  const streak = calcStreak();
  if(streak===0) return 'No active streak \u2014 log a session today to start one.';
  if(streak<3) return streak + '-day streak. Keep it going one more day.';
  if(streak<7) return streak + '-day streak \u2014 solid. Don\u2019t break it now.';
  return streak + '-day streak. That\u2019s genuinely impressive consistency.';
}
function shrutiBestDayAnswer(){
  const byDay = {};
  state.sessions.forEach(function(s){ const d=fmtDate(s.start); byDay[d]=(byDay[d]||0)+s.durationMin; });
  const entries = Object.entries(byDay);
  if(!entries.length) return 'No sessions logged yet \u2014 your first one will be the record to beat.';
  entries.sort(function(a,b){ return b[1]-a[1]; });
  return 'Your best day was ' + entries[0][0] + ' with ' + minutesToH(entries[0][1]) + ' logged.';
}
function shrutiNeglectAnswer(){
  const totals = {};
  state.subjects.forEach(function(s){ totals[s.id]=0; });
  state.sessions.filter(function(s){ return fmtDate(s.start)>=daysAgoStr(6); }).forEach(function(s){ if(totals[s.subjectId]!=null) totals[s.subjectId]+=s.durationMin; });
  const zero = state.subjects.filter(function(s){ return totals[s.id]===0; });
  if(zero.length) return zero.map(function(s){return s.name;}).join(', ') + ' — no time logged in the last 7 days.';
  let least=state.subjects[0];
  state.subjects.forEach(function(s){ if(totals[s.id]<totals[least.id]) least=s; });
  return least ? (least.name + ' has the least time this week (' + minutesToH(totals[least.id]) + ') \u2014 worth a look.') : 'Add a subject first.';
}
function shrutiConsistencyAnswer(){
  const dates = new Set(state.sessions.map(function(s){ return fmtDate(s.start); }));
  if(dates.size===0) return 'No sessions yet \u2014 nothing to measure consistency against.';
  const sorted = Array.from(dates).sort();
  const first = new Date(sorted[0]);
  const daysSince = Math.max(1, Math.round((new Date(todayStr())-first)/86400000)+1);
  const pct = Math.round((dates.size/daysSince)*100);
  return 'You\u2019ve studied on ' + dates.size + ' of the last ' + daysSince + ' days (' + pct + '%) since your first logged session.';
}
function shrutiBuildRoutine(availableMin){
  const todayS = todayStr(), tomorrowS = daysFromNowStr(1);
  let remaining = availableMin;
  const lines = [];
  const urgent = state.events.filter(function(e){ return isEventUpcoming(e) && (e.date===todayS || e.date===tomorrowS); })
    .sort(function(a,b){
      if(!!a.priority !== !!b.priority) return a.priority ? -1 : 1;
      return (a.type==='exam'?0:1) - (b.type==='exam'?0:1);
    });
  urgent.forEach(function(e){
    if(remaining<=15) return;
    const subj = subjectById(e.subjectId);
    const block = Math.min(45, remaining, e.estMin||45);
    lines.push(block + ' min \u2014 ' + (subj?subj.name:'') + ': ' + e.title + ' (' + e.type + ')');
    remaining -= block;
    if(remaining>10){ lines.push('10 min \u2014 Break'); remaining -= 10; }
  });
  const totals = {};
  state.subjects.forEach(function(s){ totals[s.id]=0; });
  state.sessions.filter(function(s){ return fmtDate(s.start)>=daysAgoStr(6); }).forEach(function(s){ if(totals[s.subjectId]!=null) totals[s.subjectId]+=s.durationMin; });
  const ranked = state.subjects.slice().sort(function(a,b){ return totals[a.id]-totals[b.id]; });
  let i = 0;
  let guard = 0;
  while(remaining>15 && ranked.length && guard<20){
    guard++;
    const subj = ranked[i % ranked.length];
    const block = Math.min(40, remaining);
    lines.push(block + ' min \u2014 ' + subj.name);
    remaining -= block;
    if(remaining>10){ lines.push('10 min \u2014 Break'); remaining -= 10; }
    i++;
  }
  if(!lines.length) return 'Not enough time to build a routine \u2014 try a larger window.';
  return lines.join('\n');
}
function timeToMinutes(t){ const p=t.split(':'); return parseInt(p[0],10)*60+parseInt(p[1],10); }
function minutesToTimeLabel(mins){
  mins = ((mins%1440)+1440)%1440;
  let h = Math.floor(mins/60), m = mins%60;
  const ap = h>=12?'pm':'am'; let h12=h%12; if(h12===0) h12=12;
  return h12+':'+pad(m)+ap;
}
function shrutiBuildFullDayRoutine(){
  const todayS = todayStr(), tomorrowS = daysFromNowStr(1);
  const weekday = new Date().getDay();
  const winStart = timeToMinutes(state.settings.studyWindowStart);
  const winEnd = timeToMinutes(state.settings.studyWindowEnd);
  if(winEnd<=winStart) return 'Your study window in the Plan tab doesn\u2019t leave any usable time \u2014 check the start/end times there.';

  const busyToday = state.busyBlocks.filter(function(b){ return b.day===weekday; })
    .map(function(b){ return { start: Math.max(winStart, timeToMinutes(b.start)), end: Math.min(winEnd, timeToMinutes(b.end)), label: b.label }; })
    .filter(function(b){ return b.end>b.start; })
    .sort(function(a,b){ return a.start-b.start; });

  const timeline = [];
  let cursor = winStart;
  busyToday.forEach(function(b){
    if(b.start>cursor) timeline.push({ type:'free', start:cursor, end:b.start });
    timeline.push({ type:'busy', start:b.start, end:b.end, label:b.label });
    cursor = Math.max(cursor, b.end);
  });
  if(cursor<winEnd) timeline.push({ type:'free', start:cursor, end:winEnd });

  const urgentItems = state.events.filter(function(e){ return isEventUpcoming(e) && (e.date===todayS || e.date===tomorrowS); })
    .sort(function(a,b){
      if(!!a.priority !== !!b.priority) return a.priority ? -1 : 1;
      return (a.type==='exam'?0:1) - (b.type==='exam'?0:1);
    });

  const totals = {};
  state.subjects.forEach(function(s){ totals[s.id]=0; });
  state.sessions.filter(function(s){ return fmtDate(s.start)>=daysAgoStr(6); }).forEach(function(s){ if(totals[s.subjectId]!=null) totals[s.subjectId]+=s.durationMin; });
  const ranked = state.subjects.slice().sort(function(a,b){ return totals[a.id]-totals[b.id]; });

  let itemIdx = 0, subjIdx = 0;
  const lines = [];
  let anyFreeTime = false;
  timeline.forEach(function(seg){
    if(seg.type==='busy'){
      lines.push(minutesToTimeLabel(seg.start) + ' \u2013 ' + minutesToTimeLabel(seg.end) + ' \u2014 ' + seg.label);
      return;
    }
    anyFreeTime = true;
    let t = seg.start;
    let guard = 0;
    while(t < seg.end - 10 && guard < 30){
      guard++;
      if(itemIdx < urgentItems.length){
        const e = urgentItems[itemIdx];
        const subj = subjectById(e.subjectId);
        const block = Math.min(e.estMin||45, seg.end-t);
        lines.push(minutesToTimeLabel(t) + ' \u2013 ' + minutesToTimeLabel(t+block) + ' \u2014 ' + (subj?subj.name:'') + ': ' + e.title + ' (' + e.type + ')');
        t += block; itemIdx++;
      } else if(ranked.length){
        const subj = ranked[subjIdx % ranked.length];
        const block = Math.min(40, seg.end-t);
        lines.push(minutesToTimeLabel(t) + ' \u2013 ' + minutesToTimeLabel(t+block) + ' \u2014 ' + subj.name);
        t += block; subjIdx++;
      } else { break; }
      if(t < seg.end - 10){
        const brk = Math.min(10, seg.end-t);
        lines.push(minutesToTimeLabel(t) + ' \u2013 ' + minutesToTimeLabel(t+brk) + ' \u2014 Break');
        t += brk;
      }
    }
  });
  if(!anyFreeTime) return 'Your whole study window today is booked with tuition/busy time \u2014 nothing free to schedule.';
  if(!lines.length) return 'Not enough free time in today\u2019s window to build a routine.';
  return lines.join('\n');
}

  document.getElementById('streakNum').textContent = streak + (streak===1?' day':' days');
  const sortedDates = Array.from(dateSet).sort();
  let ratioText = '';
  if(sortedDates.length){
    const first = new Date(sortedDates[0]);
    const daysSince = Math.max(1, Math.round((new Date(todayStr())-first)/86400000)+1);
    ratioText = 'Studied ' + dateSet.size + ' of ' + daysSince + ' days';
  }
  document.getElementById('streakRatio').textContent = ratioText;
}
function renderCompareList(){
  const today = new Date();
  const weekdayIdx = today.getDay();
  document.getElementById('compareWeekdayLabel').textContent = 'Every ' + DAY_NAMES[weekdayIdx] + ' logged';
  const byDay = {};
  state.sessions.forEach(function(s){ const d=fmtDate(s.start); byDay[d]=(byDay[d]||0)+s.durationMin; });
  let entries = Object.entries(byDay).filter(function(e){ return new Date(e[0]).getDay()===weekdayIdx; });
  if(!entries.length){ document.getElementById('compareList').innerHTML = '<div class="empty-state" style="padding:16px 0;">No ' + DAY_NAMES[weekdayIdx] + ' data yet.</div>'; return; }
  const maxVal = Math.max.apply(null, entries.map(function(e){return e[1];}));
  if(compareSortMode==='new-old') entries.sort(function(a,b){ return a[0]<b[0]?1:-1; });
  else if(compareSortMode==='old-new') entries.sort(function(a,b){ return a[0]<b[0]?-1:1; });
  else if(compareSortMode==='high-low') entries.sort(function(a,b){ return b[1]-a[1]; });
  else entries.sort(function(a,b){ return a[1]-b[1]; });
  document.getElementById('compareList').innerHTML = entries.map(function(e){
    const isBest = e[1]===maxVal;
    return '<div class="compare-row ' + (isBest?'best':'') + '"><span class="cr-date">' + e[0] + '</span><span>' + minutesToH(e[1]) + (isBest?'<span class="best-tag">Best</span>':'') + '</span></div>';
  }).join('');
}
function sumForSubjectRange(subjectId, startDate, endDate){
  return state.sessions.filter(function(s){ return s.subjectId===subjectId && fmtDate(s.start)>=startDate && fmtDate(s.start)<=endDate; }).reduce(function(a,s){ return a+s.durationMin; },0);
}
function sumMaybeFiltered(start, end){
  if(trendsSubjectFilter==='all') return sumForRange(start, end);
  return sumForSubjectRange(trendsSubjectFilter, start, end);
}
function renderTrendsChart(){
  const ctx = document.getElementById('trendsCanvas');
  if(!window.Chart){ const bb=document.getElementById('barBreakdown'); if(bb) bb.innerHTML='<div class="empty-state" style="padding:12px 0;">Charts need an internet connection the first time. Reconnect and reopen Trends.</div>'; return; }
  if(trendsChart){ trendsChart.destroy(); trendsChart=null; }
  document.getElementById('barBreakdown').innerHTML = '';
  let labels=[], datasets=[], totalMin=0, prevMin=0, title='';
  currentBuckets = [];

  function buildDatasetsForDays(dayStrs){
    return state.subjects.map(function(subj){
      return { label: subj.name, subjId: subj.id, data: dayStrs.map(function(d){ return state.sessions.filter(function(x){ return x.subjectId===subj.id && fmtDate(x.start)===d; }).reduce(function(a,x){ return a+x.durationMin; },0)/60; }), backgroundColor: subj.color, borderRadius:3 };
    });
  }

  if(activePeriod==='day'){
    title = 'Today';
    if(trendsSubjectFilter==='all'){
      labels = state.subjects.map(function(s){ return s.name; });
      const data = state.subjects.map(function(s){ return state.sessions.filter(function(x){ return x.subjectId===s.id && fmtDate(x.start)===todayStr(); }).reduce(function(a,x){ return a+x.durationMin; },0)/60; });
      datasets = [{ label:'Today', data, backgroundColor: state.subjects.map(function(s){return s.color;}), borderRadius:4 }];
    } else {
      const fSubj = subjectById(trendsSubjectFilter);
      labels = [fSubj ? fSubj.name : ''];
      const val = fSubj ? state.sessions.filter(function(x){ return x.subjectId===fSubj.id && fmtDate(x.start)===todayStr(); }).reduce(function(a,x){ return a+x.durationMin; },0)/60 : 0;
      datasets = [{ label:'Today', data:[val], backgroundColor:[fSubj?fSubj.color:'#888'], borderRadius:4 }];
    }
    totalMin = sumMaybeFiltered(todayStr(), todayStr());
    prevMin = sumMaybeFiltered(daysAgoStr(1), daysAgoStr(1));
    currentBuckets = (trendsSubjectFilter==='all' ? state.subjects : [subjectById(trendsSubjectFilter)]).map(function(){ return { start: todayStr(), end: todayStr() }; });
  } else if(activePeriod==='week'){
    const shift = weekOffset*7;
    const dayStrs = [6,5,4,3,2,1,0].map(function(n){ return daysAgoStr(n+shift); });
    title = weekOffset===0 ? 'This week' : (parseLocalDate(dayStrs[0]).toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' \u2013 ' + parseLocalDate(dayStrs[6]).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    labels = dayStrs.map(function(d){ return parseLocalDate(d).toLocaleDateString('en-US',{weekday:'short'}); });
    datasets = buildDatasetsForDays(dayStrs);
    totalMin = sumMaybeFiltered(dayStrs[0], dayStrs[6]);
    prevMin = sumMaybeFiltered(daysAgoStr(13+shift), daysAgoStr(7+shift));
    currentBuckets = dayStrs.map(function(d){ return { start:d, end:d }; });
  } else if(activePeriod==='month'){
    const now = new Date();
    const refDate = new Date(now.getFullYear(), now.getMonth() - monthOffset, 1);
    const year = refDate.getFullYear(), month = refDate.getMonth();
    const isCurrentMonth = monthOffset===0;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const weekBoundaries = [[1,7],[8,14],[15,21],[22,daysInMonth]];
    labels = ['Week 1','Week 2','Week 3','Week 4'];
    const monthRanges = weekBoundaries.map(function(r){
      return { start: fmtDate(new Date(year,month,r[0])), end: fmtDate(new Date(year,month,r[1])) };
    });
    datasets = state.subjects.map(function(subj){
      return { label: subj.name, subjId: subj.id, data: monthRanges.map(function(r){ return sumForSubjectRange(subj.id, r.start, r.end)/60; }), backgroundColor: subj.color, borderRadius:3 };
    });
    title = isCurrentMonth ? 'This month' : refDate.toLocaleDateString('en-US',{month:'long', year:'numeric'});
    const monthStartStr = fmtDate(new Date(year,month,1));
    const monthEndStr = fmtDate(new Date(year,month,daysInMonth));
    totalMin = sumMaybeFiltered(monthStartStr, isCurrentMonth ? todayStr() : monthEndStr);
    const prevMonthRef = new Date(year, month-1, 1);
    const pYear = prevMonthRef.getFullYear(), pMonth = prevMonthRef.getMonth();
    const prevDaysInMonth = new Date(pYear, pMonth+1, 0).getDate();
    const sameDayCap = isCurrentMonth ? Math.min(now.getDate(), prevDaysInMonth) : prevDaysInMonth;
    prevMin = sumMaybeFiltered(fmtDate(new Date(pYear,pMonth,1)), fmtDate(new Date(pYear,pMonth,sameDayCap)));
    currentBuckets = monthRanges;
  } else {
    const now = new Date();
    const year = now.getFullYear() - yearOffset;
    const isCurrentYear = yearOffset===0;
    labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monthRanges = [];
    for(let mo=0; mo<12; mo++){
      const first = new Date(year, mo, 1); const last = new Date(year, mo+1, 0);
      monthRanges.push({ start: fmtDate(first), end: fmtDate(last) });
    }
    datasets = state.subjects.map(function(subj){
      return { label: subj.name, subjId: subj.id, data: monthRanges.map(function(r){ return sumForSubjectRange(subj.id, r.start, r.end)/60; }), backgroundColor: subj.color, borderRadius:3 };
    });
    title = isCurrentYear ? 'This year' : String(year);
    totalMin = sumMaybeFiltered(fmtDate(new Date(year,0,1)), isCurrentYear ? todayStr() : fmtDate(new Date(year,11,31)));
    const sameDateLastYear = isCurrentYear ? fmtDate(new Date(year-1, now.getMonth(), now.getDate())) : fmtDate(new Date(year-1,11,31));
    prevMin = sumMaybeFiltered(fmtDate(new Date(year-1,0,1)), sameDateLastYear);
    currentBuckets = monthRanges;
  }

  if(activePeriod!=='day' && trendsSubjectFilter!=='all'){
    datasets = datasets.filter(function(d){ return d.subjId===trendsSubjectFilter; });
  }

  document.getElementById('trendTitle').textContent = title;
  document.getElementById('trendTotal').textContent = minutesToH(totalMin);
  const weekNavRow = document.getElementById('weekNavRow');
  const rangeLabelEl = document.getElementById('weekRangeLabel');
  if(activePeriod==='week'){
    weekNavRow.style.display = 'flex';
    rangeLabelEl.textContent = currentBuckets[0].start.slice(5) + ' \u2013 ' + currentBuckets[6].start.slice(5);
    document.getElementById('weekNext').disabled = weekOffset===0;
  } else if(activePeriod==='month'){
    weekNavRow.style.display = 'flex';
    rangeLabelEl.textContent = '';
    document.getElementById('weekNext').disabled = monthOffset===0;
  } else if(activePeriod==='year'){
    weekNavRow.style.display = 'flex';
    rangeLabelEl.textContent = '';
    document.getElementById('weekNext').disabled = yearOffset===0;
  } else {
    weekNavRow.style.display = 'none';
  }
  const deltaEl = document.getElementById('trendDelta');
  if(prevMin>0){
    const pctChange = Math.round(((totalMin-prevMin)/prevMin)*100);
    deltaEl.textContent = (pctChange>=0?'+':'')+pctChange+'%';
    deltaEl.className = 'delta '+(pctChange>=0?'up':'down');
  }else{ deltaEl.textContent = ''; }

  const chartDatasets = datasets.map(function(d){
    if(chartTypeMode==='line'){
      const lineColor = Array.isArray(d.backgroundColor) ? d.backgroundColor[0] : d.backgroundColor;
      return Object.assign({}, d, { borderColor: lineColor, backgroundColor: lineColor, pointBackgroundColor: lineColor, tension:0.35, pointRadius:3, borderWidth:2, fill:false });
    }
    return d;
  });

  trendsChart = new Chart(ctx, {
    type: chartTypeMode,
    data:{ labels, datasets: chartDatasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{
        x:{ stacked: chartTypeMode==='bar' && activePeriod!=='day', grid:{display:false}, ticks:{color:'#63656F', font:{size:10.5}} },
        y:{ stacked: chartTypeMode==='bar' && activePeriod!=='day', grid:{display:false}, ticks:{color:'#63656F', font:{size:10.5}} }
      },
      plugins:{ legend:{display:false} },
      onClick:function(evt, elements){
        if(!elements.length) return;
        const idx = elements[0].index;
        showBarBreakdown(idx);
      }
    }
  });
}
function showBarBreakdown(idx){
  lastBarIdx = idx;
  const bucket = activePeriod==='day' ? currentBuckets[0] : currentBuckets[idx];
  if(!bucket) return;
  const label = activePeriod==='day' ? state.subjects[idx].name : (trendsChart ? trendsChart.data.labels[idx] : '');
  const dateSubtitle = (activePeriod==='week' || activePeriod==='day')
    ? new Date(bucket.start).toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'})
    : (bucket.start===bucket.end ? bucket.start : bucket.start + ' \u2013 ' + bucket.end);
  const totals = state.subjects.map(function(s){
    return { subj:s, min: sumForSubjectRange(s.id, bucket.start, bucket.end) };
  }).filter(function(t){ return t.min>0; }).sort(function(a,b){ return b.min-a.min; });
  const barTotal = totals.reduce(function(a,t){ return a+t.min; },0);
  const el = document.getElementById('barBreakdown');
  if(!totals.length){ el.innerHTML = '<div class="empty-state" style="padding:12px 0;">No sessions in this period.</div>'; return; }
  el.innerHTML = '<div class="breakdown-head" style="display:flex; flex-direction:column; gap:1px;"><div style="display:flex; justify-content:space-between; align-items:center;"><span>' + label + '</span><span class="mono" style="color:var(--text);">' + minutesToH(barTotal) + ' total</span></div><span style="font-size:10.5px; color:var(--text-3); font-family:\'IBM Plex Mono\',monospace;">' + dateSubtitle + '</span></div><ul class="breakdown-list">' + totals.map(function(t){
    return '<li><span class="bd-left"><span class="dot" style="background:'+t.subj.color+'"></span>'+esc(t.subj.name)+'</span><span class="mono">'+minutesToH(t.min)+'</span></li>';
  }).join('') + '</ul>' + (activePeriod==='month' ? '<button class="btn btn-ghost" id="dayWiseBtn" style="width:100%; margin-top:10px; font-size:12px; padding:9px 0;">See day-by-day breakdown</button>' : '');

  if(activePeriod==='month'){
    document.getElementById('dayWiseBtn').addEventListener('click', function(){ showWeekDayBreakdown(bucket); });
  }
}
function showWeekDayBreakdown(bucket){
  const el = document.getElementById('barBreakdown');
  const days = [];
  let cursor = new Date(bucket.start + 'T00:00:00');
  const end = new Date(bucket.end + 'T00:00:00');
  while(cursor<=end){
    const dateStr = fmtDate(cursor);
    days.push({ date: dateStr, total: sumForRange(dateStr, dateStr) });
    cursor.setDate(cursor.getDate()+1);
  }
  el.innerHTML = '<button class="btn btn-ghost" id="backToSubjBtn" style="font-size:11px; padding:6px 12px; margin-bottom:10px;">&larr; Back to subjects</button><ul class="breakdown-list">' + days.map(function(d){
    const label = new Date(d.date + 'T00:00:00').toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
    return '<li><span class="bd-left">' + label + '</span><span class="mono">' + minutesToH(d.total) + '</span></li>';
  }).join('') + '</ul>';
  document.getElementById('backToSubjBtn').addEventListener('click', function(){ showBarBreakdown(lastBarIdx); });
}

function studyWindowMinutesToday(){
  const s = state.settings.studyWindowStart.split(':'); const e = state.settings.studyWindowEnd.split(':');
  const startMin = parseInt(s[0],10)*60+parseInt(s[1],10);
  const endMin = parseInt(e[0],10)*60+parseInt(e[1],10);
  return Math.max(0, endMin-startMin);
}
function busyMinutesForDate(dateObj){
  const day = dateObj.getDay();
  let total = 0;
  state.busyBlocks.filter(function(b){ return b.day===day; }).forEach(function(b){
    const s = b.start.split(':'); const e = b.end.split(':');
    const sm = parseInt(s[0],10)*60+parseInt(s[1],10);
    const em = parseInt(e[0],10)*60+parseInt(e[1],10);
    total += Math.max(0, em-sm);
  });
  return total;
}

function notifyLocal(title, body){
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(function(reg){
        if(reg && reg.showNotification){ reg.showNotification(title, { body: body, icon:'icon-192.png' }); }
        else { new Notification(title, { body: body }); }
      }).catch(function(){ try{ new Notification(title, { body: body }); }catch(e){} });
    } else { new Notification(title, { body: body }); }
  }catch(e){}
}
function maybeNotifyUpcoming(){
  if(!state.settings.notifyEnabled) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const todayS = todayStr(), tomorrowS = daysFromNowStr(1);
  state.events.filter(function(e){ return isEventUpcoming(e) && (e.date===todayS || e.date===tomorrowS); }).forEach(function(e){
    const key = 'notified_'+e.id+'_'+e.date;
    if(localStorage.getItem(key)) return;
    const subj = subjectById(e.subjectId);
    notifyLocal('Study Log reminder', (subj?subj.name+' ':'') + e.type + ': ' + e.title + ' \u2014 ' + (e.date===todayS?'today':'tomorrow'));
    localStorage.setItem(key,'1');
  });
}

let logDateFilter = null;
function buildSessionListHtml(){
  let sessions = state.sessions;
  if(logDateFilter){ sessions = sessions.filter(function(s){ return fmtDate(s.start)===logDateFilter; }); }
  const grouped = {};
  sessions.slice().sort(function(a,b){ return b.start-a.start; }).forEach(function(s){
    const d = fmtDate(s.start);
    (grouped[d]=grouped[d]||[]).push(s);
  });
  const dates = Object.keys(grouped).sort().reverse();
  if(dates.length===0){
    return '<div class="empty-state">' + (logDateFilter ? 'No sessions on that date.' : 'No sessions yet. Start a timer from the Track tab.') + '</div>';
  }
  return dates.map(function(date){
    const label = date===todayStr() ? 'Today' : parseLocalDate(date).toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
    const entries = grouped[date].map(function(s){
      const subj = subjectById(s.subjectId);
      const options = state.subjects.map(function(sub){ return '<option value="' + sub.id + '"' + (sub.id===s.subjectId?' selected':'') + '>' + esc(sub.name) + '</option>'; }).join('');
      return '<div class="log-entry" style="--entry-color:' + (subj?subj.color:'#888') + '">' +
        '<div class="log-entry-info"><select class="session-subj-select" data-session="' + s.id + '">' + options + (subj?'':'<option value="" selected disabled>Deleted subject</option>') + '</select><span class="time">' + fmtTime(s.start) + ' \u2013 ' + fmtTime(s.end) + '</span></div>' +
        '<div style="display:flex; align-items:center; gap:10px;"><span class="log-entry-dur">' + s.durationMin + 'm</span><button class="del-btn" data-id="' + s.id + '" aria-label="Delete session">&times;</button></div>' +
      '</div>';
    }).join('');
    return '<div class="log-date-group"><div class="log-date-head">' + label + '</div>' + entries + '</div>';
  }).join('');
}

  function recalcManualMinutes(){
    const s = document.getElementById('manualStartInput').value;

    }
  }
  document.getElementById('manualStartInput').addEventListener('change', recalcManualMinutes);

      const s = state.sessions.find(function(x){ return x.id===sel.dataset.session; });
      if(s){
        s.subjectId = sel.value;
        storageSet(STORAGE_KEYS.sessions, state.sessions);
        renderAll();
        renderSessionPanel();
      }
    });
  });
}

/* ================= WINTER ARC ================= */
const WINTER_ICONS = ['\u2600\uFE0F','\uD83C\uDFCB\uFE0F','\uD83E\uDDD8','\uD83D\uDCDA','\uD83D\uDCA7','\uD83C\uDFC3','\uD83E\uDD57','\uD83D\uDE34','\u270D\uFE0F','\uD83C\uDFAF','\uD83E\uDDCA','\uD83D\uDE4F'];
let winterTab = 'today';
let winterMonthIdx = null;
let winterEditingId = null;

function winterArcWindow(){
  const y = new Date().getFullYear();
  return { start:new Date(y,9,1,0,0,0,0), end:new Date(y,11,31,23,59,59,999), year:y };
}
function isWinterArcLive(){
  const w = winterArcWindow(); const now = new Date();
  return now>=w.start && now<=w.end;
}
function winterDaysToStart(){
  const w = winterArcWindow(); const now = new Date();
  return Math.max(0, Math.ceil((w.start - now)/86400000));
}
function winterIsScheduled(t, ds){
  return t.days.indexOf(parseLocalDate(ds).getDay())!==-1;
}
function winterIsDone(t, ds){
  return !!(state.winterLogs[t.id] && state.winterLogs[t.id][ds]);
}
function winterToggle(targetId, ds){
  if(!state.winterLogs[targetId]) state.winterLogs[targetId] = {};
  if(state.winterLogs[targetId][ds]) delete state.winterLogs[targetId][ds];
  else state.winterLogs[targetId][ds] = true;
  storageSet(STORAGE_KEYS.winterLogs, state.winterLogs);
}
function winterStreak(t){
  const w = winterArcWindow();
  let streak = 0;
  const ds0 = todayStr();
  if(winterIsScheduled(t, ds0) && winterIsDone(t, ds0)) streak++;
  let cur = new Date();
  cur.setDate(cur.getDate()-1);
  while(cur >= w.start){
    const ds = fmtDate(cur);
    if(winterIsScheduled(t, ds)){
      if(winterIsDone(t, ds)) streak++; else break;
    }
    cur.setDate(cur.getDate()-1);
  }
  return streak;
}
function winterSchedLabel(t){
  if(t.days.length===7) return 'Everyday';
  if(!t.days.length) return 'Never';
  return t.days.slice().sort().map(function(i){ return DAY_NAMES[i].slice(0,2); }).join(', ');
}
function winterCountRange(startDs, endDs){
  const start = parseLocalDate(startDs), end = parseLocalDate(endDs);
  let scheduled=0, done=0;
  state.winterTargets.forEach(function(t){
    let cur = new Date(start);
    while(cur<=end){
      const ds = fmtDate(cur);
      if(winterIsScheduled(t, ds)){
        scheduled++;
        if(winterIsDone(t, ds)) done++;
      }
      cur.setDate(cur.getDate()+1);
    }
  });
  return { scheduled: scheduled, done: done };
}
function winterMonthKey(){
  const w = winterArcWindow();
  return w.year + '-' + pad(winterMonthIdx+1);
}
function winterRingSvg(pct, size, color){
  size = size || 92;
  const r = size/2 - 9;
  const c = 2*Math.PI*r;
  const clamped = Math.max(0, Math.min(100, pct));
  const off = c - (clamped/100)*c;
  return '<svg viewBox="0 0 '+size+' '+size+'">' +
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="8"/>' +
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" ' +
      'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"/>' +
  '</svg>';
}

function openWinterArcPage(){
  document.getElementById('winterArcPage').classList.add('open');
  const nowMonth = new Date().getMonth();
  winterMonthIdx = (nowMonth>=9 && nowMonth<=11) ? nowMonth : 9;
