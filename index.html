function winterEditIconSvg(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
}
function winterCardHtml(t){
  const streak = winterStreak(t);
  const ds0 = todayStr();
  const doneToday = winterIsDone(t, ds0);
  const now = new Date();
  const sun = new Date(now); sun.setDate(now.getDate()-now.getDay());
  let days = '', labels = '';
  for(let i=0;i<7;i++){
    const d = new Date(sun); d.setDate(sun.getDate()+i);
    const ds = fmtDate(d);
    const done = winterIsDone(t, ds);
    const sched = winterIsScheduled(t, ds);
    const isToday = ds===ds0;
    labels += '<span>'+DAY_NAMES[i][0]+'</span>';
    days += '<button class="w-day '+(done?'done':'')+' '+(isToday?'is-today':'')+' '+(!sched?'off':'')+'" style="--w-color:'+t.color+'" data-wcheck="'+t.id+'" data-wdate="'+ds+'"'+(!sched?' disabled':'')+'></button>';
  }
  return '<div class="w-card" style="--w-color:'+t.color+'">' +
    '<div class="w-card-top">' +
      '<div class="w-icon">'+t.icon+'</div>' +
      '<div class="w-card-info"><div class="w-name">'+esc(t.name)+'</div><div class="w-streak">\uD83D\uDD25 '+streak+' Day'+(streak===1?'':'s')+'</div></div>' +
      '<button class="w-icon-btn" data-wedit="'+t.id+'">'+winterEditIconSvg()+'</button>' +
      '<button class="w-check-btn '+(doneToday?'done':'')+'" style="--w-color:'+t.color+'" data-wcheck="'+t.id+'" data-wdate="'+ds0+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 13l4 4L19 7"/></svg></button>' +
    '</div>' +
    '<div class="w-day-labels">'+labels+'</div>' +
    '<div class="w-day-row">'+days+'</div>' +
  '</div>';
}
function winterTodayHtml(targets){
  const ds = todayStr();
  const c = winterCountRange(ds, ds);
  const pct = c.scheduled>0 ? Math.round((c.done/c.scheduled)*100) : 0;
  let html = winterRingCardHtml(pct, "Today's progress", c.done+' of '+c.scheduled+' scheduled');
  if(!targets.length) return html + winterEmptyState();
  targets.forEach(function(t){ html += winterCardHtml(t); });
  return html;
}
function winterWeekHtml(targets){
  const now = new Date();
  const sun = new Date(now); sun.setDate(now.getDate()-now.getDay());
  const sat = new Date(sun); sat.setDate(sun.getDate()+6);
  const c = winterCountRange(fmtDate(sun), fmtDate(sat));
  const pct = c.scheduled>0 ? Math.round((c.done/c.scheduled)*100) : 0;
  let html = winterRingCardHtml(pct, "This week's progress", c.done+' of '+c.scheduled+' scheduled');
  if(!targets.length) return html + winterEmptyState();
  targets.forEach(function(t){ html += winterCardHtml(t); });
  return html;
}
function winterNotesCardHtml(monthLabel){
  const key = winterMonthKey();
  const notes = state.winterNotes[key] || {};
  return '<div class="w-card w-notes-card">' +

function winterMonthHtml(targets){
  const w = winterArcWindow();
  const monthNames = ['October','November','December'];
  const idx = winterMonthIdx;
  const monthStart = fmtDate(new Date(w.year, idx, 1));
  const monthEnd = fmtDate(new Date(w.year, idx+1, 0));
  const c = winterCountRange(monthStart, monthEnd);
  const pct = c.scheduled>0 ? Math.round((c.done/c.scheduled)*100) : 0;
  let html = winterRingCardHtml(pct, monthNames[idx-9]+' progress', c.done+' of '+c.scheduled+' scheduled');
  html += '<div class="w-month-pills">' +
    [9,10,11].map(function(m){
      return '<button class="w-month-pill '+(idx===m?'active':'')+'" data-wmonth="'+m+'">'+monthNames[m-9].slice(0,3)+'</button>';
    }).join('') + '</div>';
  if(targets.length){
    const daysInMonth = new Date(w.year, idx+1, 0).getDate();
    const firstDow = new Date(w.year, idx, 1).getDay();
    const todayDs = todayStr();
    targets.forEach(function(t){
      const streak = winterStreak(t);
      let cells = '';
      for(let i=0;i<firstDow;i++) cells += '<button class="w-cal-cell blank"></button>';
      for(let day=1; day<=daysInMonth; day++){
        const ds = w.year+'-'+pad(idx+1)+'-'+pad(day);
        const done = winterIsDone(t, ds);
        const sched = winterIsScheduled(t, ds);
        const isToday = ds===todayDs;
        cells += '<button class="w-cal-cell '+(done?'done':'')+' '+(isToday?'today':'')+' '+(!sched?'off':'')+'" style="--w-color:'+t.color+'" data-wcheck="'+t.id+'" data-wdate="'+ds+'"'+(!sched?' disabled':'')+'></button>';
      }
      html += '<div class="w-card" style="--w-color:'+t.color+'">' +
        '<div class="w-month-card-head">' +
          '<div class="w-icon">'+t.icon+'</div>' +
          '<div class="w-card-info"><div class="w-name">'+esc(t.name)+'</div><div class="w-streak">\uD83D\uDD25 '+streak+' Day'+(streak===1?'':'s')+'</div></div>' +
          '<button class="w-icon-btn" data-wedit="'+t.id+'">'+winterEditIconSvg()+'</button>' +
          '<span class="w-sched-label">'+winterSchedLabel(t)+'</span>' +
        '</div>' +
        '<div class="w-cal-headers">'+['S','M','T','W','T','F','S'].map(function(d){return '<span>'+d+'</span>';}).join('')+'</div>' +
        '<div class="w-cal-grid">'+cells+'</div>' +
      '</div>';
    });
  } else {
    html += winterEmptyState();
  }
  html += winterNotesCardHtml(monthNames[idx-9]);
  return html;
}
function winterArcTabHtml(targets){
  const w = winterArcWindow();
  const startDs = fmtDate(w.start), endDs = fmtDate(w.end);
  const c = winterCountRange(startDs, endDs);
  const pct = c.scheduled>0 ? Math.round((c.done/c.scheduled)*100) : 0;
  let html = winterRingCardHtml(pct, 'Winter Arc (Oct - Dec)', c.done+' of '+c.scheduled+' scheduled');
  if(!targets.length) return html + winterEmptyState();
  const todayDs = todayStr();
  targets.forEach(function(t){
    const streak = winterStreak(t);
    let cells = '';
    let cur = new Date(w.start);
    while(cur<=w.end){
      const ds = fmtDate(cur);
      const done = winterIsDone(t, ds);
      const sched = winterIsScheduled(t, ds);
      const isToday = ds===todayDs;
      cells += '<button class="w-cal-cell '+(done?'done':'')+' '+(isToday?'today':'')+' '+(!sched?'off':'')+'" style="--w-color:'+t.color+'" data-wcheck="'+t.id+'" data-wdate="'+ds+'"'+(!sched?' disabled':'')+'></button>';
      cur.setDate(cur.getDate()+1);
    }
    html += '<div class="w-card" style="--w-color:'+t.color+'">' +
      '<div class="w-month-card-head">' +
        '<div class="w-icon">'+t.icon+'</div>' +
        '<div class="w-card-info"><div class="w-name">'+esc(t.name)+'</div><div class="w-streak">\uD83D\uDD25 '+streak+' Day'+(streak===1?'':'s')+'</div></div>' +
        '<button class="w-icon-btn" data-wedit="'+t.id+'">'+winterEditIconSvg()+'</button>' +
        '<span class="w-sched-label">'+winterSchedLabel(t)+'</span>' +
      '</div>' +
      '<div class="w-arc-grid">'+cells+'</div>' +
    '</div>';
  });
  return html;
}
function renderWinterTabContent(){
  const el = document.getElementById('winterTabContent');
  if(!el) return;
  const targets = state.winterTargets;
  if(winterTab==='today') el.innerHTML = winterTodayHtml(targets);

/* ================= TO-DO LIST PAGE ================= */
let todoFilter = 'all';
let todoEditingId = null;
let todoRefreshInterval = null;

function todoRolloverCheck(){
  const today = todayStr();
  let changed = false;
  state.todos.forEach(function(t){
    if(t.todayOnly && !t.done && !t.archivedIncomplete && t.createdDate && t.createdDate !== today){
      t.archivedIncomplete = true;
      changed = true;
    }
  });
  if(changed) storageSet(STORAGE_KEYS.todos, state.todos);
}
function todoFormat12h(hh, mm){
  const period = hh>=12 ? 'PM' : 'AM';
  let h12 = hh % 12; if(h12===0) h12 = 12;
  return h12 + ':' + pad(mm) + ' ' + period;
}
function todoTimeLeftInfo(t){
  if(!t.endTime) return null;
  const parts = t.endTime.split(':');
  const hh = parseInt(parts[0],10), mm = parseInt(parts[1],10);
  if(isNaN(hh) || isNaN(mm)) return null;
  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
  const label = todoFormat12h(hh, mm);
  const diffMs = target - now;
  if(diffMs <= 0) return { text: label + ' \u00b7 Overdue', cls:'overdue' };
  const diffMin = Math.round(diffMs/60000);
  let rel;
  if(diffMin < 60) rel = diffMin + ' min left';
  else { const hrs = Math.floor(diffMin/60); rel = hrs + ' hour' + (hrs===1?'':'s') + ' left'; }
  return { text: label + ' \u00b7 ' + rel, cls: diffMin<=60 ? 'soon' : '' };
}
function todoFilteredList(){
  let list = state.todos.slice();
  if(todoFilter==='pending') list = list.filter(function(t){ return !t.done && !t.archivedIncomplete; });
  else if(todoFilter==='completed') list = list.filter(function(t){ return t.done; });
  else if(todoFilter==='incomplete') list = list.filter(function(t){ return t.archivedIncomplete && !t.done; });
  else if(todoFilter && todoFilter.indexOf('subj:')===0){
    const sid = todoFilter.slice(5);
    list = list.filter(function(t){ return t.subjectId===sid; });
  } else {
    list = list.filter(function(t){ return !t.archivedIncomplete; });
  }
  const inc = list.filter(function(t){ return !t.done; });
  const done = list.filter(function(t){ return t.done; });
  return inc.concat(done);
}
function todoEmptyMsg(){
  if(todoFilter==='pending') return 'Nothing pending. Nice work!';
  if(todoFilter==='completed') return 'No completed tasks yet.';
  if(todoFilter==='incomplete') return 'No missed \u201ctoday only\u201d tasks.';
  if(todoFilter && todoFilter.indexOf('subj:')===0) return 'No tasks for this subject yet.';
  return 'Nothing on your list yet.<br>Tap the + button to add a task.';
}
function todoItemHtml(t){
  const subj = t.subjectId ? state.subjects.find(function(s){ return s.id===t.subjectId; }) : null;
  const timeInfo = todoTimeLeftInfo(t);
  let meta = '';
  if(subj || timeInfo || t.todayOnly || t.archivedIncomplete){
    meta = '<div class="t-meta-row">';
    if(subj) meta += '<span class="t-subject-tag"><span class="dot" style="background:'+subj.color+'"></span>'+esc(subj.name)+'</span>';
    if(timeInfo) meta += '<span class="t-time-badge '+timeInfo.cls+'">'+timeInfo.text+'</span>';
    if(t.archivedIncomplete && !t.done) meta += '<span class="t-today-badge" style="color:var(--danger);">Incomplete</span>';
    else if(t.todayOnly) meta += '<span class="t-today-badge">Today only</span>';
    meta += '</div>';
  }
  return '<div class="t-item" data-tid="'+t.id+'">' +
    '<div class="t-main-row">' +
      '<button class="todo-check '+(t.done?'checked':'')+'" data-tcheck="'+t.id+'">'+(t.done?'\u2713':'')+'</button>' +
      '<span class="todo-text '+(t.done?'done':'')+'">'+esc(t.text)+'</span>' +
      '<button class="t-edit-btn" data-tedit="'+t.id+'">'+winterEditIconSvg()+'</button>' +
    '</div>' +
    meta +
  '</div>';
}
function updateTodoFilterLabel(){
  const label = document.getElementById('todoFilterLabel');
  if(!label) return;
  let txt = 'All tasks';
  if(todoFilter==='pending') txt = 'Pending';
  else if(todoFilter==='completed') txt = 'Completed';
  else if(todoFilter==='incomplete') txt = 'Incomplete';
  else if(todoFilter && todoFilter.indexOf('subj:')===0){
    const s = state.subjects.find(function(x){ return x.id===todoFilter.slice(5); });
    txt = s ? s.name : 'All tasks';
  }
  label.textContent = txt;
}
function renderTodoBody(){
  todoRolloverCheck();
  const body = document.getElementById('todoBody');
  if(!body) return;
  const list = todoFilteredList();
  body.innerHTML = list.length ? list.map(todoItemHtml).join('') : ('<div class="empty-state">'+todoEmptyMsg()+'</div>');
  wireTodoItemEvents();
  updateTodoFilterLabel();
}
function wireTodoItemEvents(){
  document.querySelectorAll('[data-tcheck]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const t = state.todos.find(function(x){ return x.id===btn.dataset.tcheck; });
      if(!t) return;
      const body = document.getElementById('todoBody');
      const oldRects = {};
      Array.prototype.forEach.call(body.children, function(el){ if(el.dataset && el.dataset.tid) oldRects[el.dataset.tid] = el.getBoundingClientRect(); });
      t.done = !t.done;
      t.completedAt = t.done ? Date.now() : null;
      storageSet(STORAGE_KEYS.todos, state.todos);
      renderTodoBody();
      Array.prototype.forEach.call(body.children, function(el){
        const id = el.dataset ? el.dataset.tid : null;
        const old = id ? oldRects[id] : null;
        if(!old) return;
        const now = el.getBoundingClientRect();
        const dy = old.top - now.top;
        if(Math.abs(dy) > 1){
          el.style.transition = 'none';
          el.style.transform = 'translateY('+dy+'px)';
        }
      });
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          Array.prototype.forEach.call(body.children, function(el){
            el.style.transition = 'transform 0.32s ease';
            el.style.transform = '';
          });
        });
      });
    });
  });
  document.querySelectorAll('[data-tedit]').forEach(function(btn){
    btn.addEventListener('click', function(){ openTodoTaskModal(btn.dataset.tedit); });
  });
}

      document.querySelectorAll('#tSubjRow .chip').forEach(function(x){ x.classList.remove('active'); });
      c.classList.add('active');
    });
  });
  document.getElementById('tTodayOnlyBtn').addEventListener('click', function(){
    const b = document.getElementById('tTodayOnlyBtn');
    const on = b.dataset.on === '1';
    b.dataset.on = on ? '0' : '1';
    b.textContent = on ? 'Off' : 'On';
  });
  document.getElementById('tTaskText').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); saveTodoTaskModal(); } });
  document.getElementById('tModalCancel').addEventListener('click', closeTodoTaskModal);
  document.getElementById('tModalSave').addEventListener('click', saveTodoTaskModal);
  if(existing){
    document.getElementById('tModalDelete').addEventListener('click', function(){
      const btn = document.getElementById('tModalDelete');
      if(btn.dataset.confirming !== '1'){
        btn.dataset.confirming = '1';
        btn.textContent = 'Tap again to delete';
        clearTimeout(btn._tt);
        btn._tt = setTimeout(function(){ btn.dataset.confirming='0'; btn.textContent='Delete task'; }, 4000);
        return;
      }
      const idx = state.todos.findIndex(function(x){ return x.id===existing.id; });
      const removed = state.todos[idx];
      state.todos = state.todos.filter(function(x){ return x.id!==existing.id; });
      storageSet(STORAGE_KEYS.todos, state.todos);
      closeTodoTaskModal();
      renderTodoBody();
      showUndoToast('Task deleted.', function(){
        state.todos.splice(idx, 0, removed);
        storageSet(STORAGE_KEYS.todos, state.todos);
        renderTodoBody();
      });
    });
  }
  setTimeout(function(){ const el = document.getElementById('tTaskText'); if(el) el.focus(); }, 50);
}
function closeTodoTaskModal(){
  const b = document.getElementById('todoModalBackdrop');
  if(b) b.remove();
  todoEditingId = null;
}
function saveTodoTaskModal(){
  const text = document.getElementById('tTaskText').value.trim();
  if(!text){ showToast('Give the task some text', 2500); return; }
  const selChip = document.querySelector('#tSubjRow .chip.active');
  const subjectId = (selChip && selChip.dataset.subj) ? selChip.dataset.subj : null;
  const endTimeVal = document.getElementById('tEndTime').value || null;
  const todayOnly = document.getElementById('tTodayOnlyBtn').dataset.on === '1';
  if(todoEditingId){
    const t = state.todos.find(function(x){ return x.id===todoEditingId; });
    if(t){
      t.text = text; t.subjectId = subjectId; t.endTime = endTimeVal; t.todayOnly = todayOnly;
      if(todayOnly && !t.createdDate) t.createdDate = todayStr();
      if(!todayOnly) t.archivedIncomplete = false;
    }
  } else {
    state.todos.push({
      id: 'td'+Date.now(), text: text, done: false,
      subjectId: subjectId, endTime: endTimeVal, todayOnly: todayOnly,
      createdDate: todayStr(), archivedIncomplete: false, completedAt: null
    });
  }
  storageSet(STORAGE_KEYS.todos, state.todos);
  closeTodoTaskModal();
  todoFilter = 'all';
  renderTodoBody();
}


/* ---------- boot ---------- */
init();

document.addEventListener('click', function(e){
  if(e.target.id==='startBtn') startTimer();
  if(e.target.id==='pauseBtn') (timer.phase==='running' ? pauseTimer() : resumeTimer());
  if(e.target.id==='stopBtn') stopTimer();
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && timer.phase==='running'){
    const active = storageGet(STORAGE_KEYS.activeTimer, null);
    if(active && active.phase==='running'){
      const elapsed = active.elapsedSec + Math.max(0, Math.floor((Date.now()-active.savedAt)/1000));
      if(timer.mode !== 'stopwatch' && elapsed >= timer.targetSec && timer.targetSec>0){
        timer.elapsedSec = timer.targetSec;
        handleTimerComplete();
      } else {
        timer.elapsedSec = elapsed;
        timer.lastTick = Date.now();
        updateTimerDisplay();
      }
    }
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
